/* =====================================================================
   중계 그래픽 레이어 (2026-11-25, impeccable 보완)
   지키는 것: 공식 로고, 키컬러 #ff4600, Pretendard.
   원칙: 빛 번짐·유리 카드·아이콘 타일·무지개색 없이, 단색 면과 선, 큰 타이포로 위계.
   색은 의미가 있을 때만: 오렌지 = 행동·지금, 민트/블루 = 팀 로리/팀 스코티, 네이비 = 중계 화면.
   ===================================================================== */
:root { --navy: #14213d; --navy-2: #0e1830; --navy-3: #1d2f57; --teal: #3f8f86; --blue: #5470b4; --r-card: 12px; }
.t-rory { --tc: var(--teal); } .t-scottie { --tc: var(--blue); }

/* 키 비주얼 + D-day: 키 비주얼의 네이비를 그대로 이어 받는 단색 면 */
.kv-band, .stage { background: var(--navy-2); }

/* 4 vs 4: 중계 라인업 보드. 팀 색은 위 굵은 선 하나로만 */
.matchup { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 0; padding: 0; border: 0; border-radius: var(--r-card); background: var(--navy); overflow: hidden; }
/* 팀 머리판(팀 색 단색) + 리더보드식 명단 */
.side { display: block; }
.side-h { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); background: var(--tc); }
.side-h { color: #fff; }
.side-h .crest { flex: none; width: 44px; height: 50px; }
.side h2 { display: flex; align-items: center; gap: var(--space-3); color: inherit; }
.side h2 .win { background: #fff; color: #111; }

.vs { align-self: stretch; justify-content: center; gap: var(--space-1); padding: 0 var(--space-6); background: var(--navy); border-left: 1px solid rgba(255, 255, 255, .12); border-right: 1px solid rgba(255, 255, 255, .12); }
.vs b { font: 900 40px/1 var(--font-sans); letter-spacing: -1.5px; color: #fff; }
.vs span { color: rgba(255, 255, 255, .72); }

/* 이벤트 내용: 단색 패널, 팀 칸은 일러스트와 같은 색 아바타 */
.lineup { background: var(--bg-300); }
.lineup-panel { border-radius: var(--r-card); border: 1px solid var(--line-200); background: var(--surface-100); }
.lineup-panel .team li { border-radius: 10px; border: 1px dashed rgba(255, 255, 255, .25); background: transparent; color: var(--text-150); }
.lineup-panel .team li .ic { width: 56px; height: 56px; border: 2px dashed rgba(255, 255, 255, .3); color: var(--text-150); font-size: 18px; }
.lineup-panel .team li.on { border: 0; background: var(--surface-300); }
.lineup-panel .team li.on .ic { border: 0; background: var(--brand); color: #fff; }
.lineup-panel .team li.me { border: 2px solid var(--brand); }
.lineup-panel .team li.on .sng-check-box { width: 56px; height: 56px; border: 0; border-radius: var(--radius-full); }
.lineup-panel .team li.on .sng-check-box { background: var(--navy-3); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); }
.lineup-panel .team li.on .sng-check-box::after { width: 18px; height: 9px; border-width: 0 0 3px 3px; border-color: #fff; }
/* 핵심 정보: 카드 대신 위아래 선 사이의 정보 줄 */
.facts { margin-top: var(--space-6); border: 0; border-top: 1px solid var(--line-300); border-bottom: 1px solid var(--line-300); border-radius: 0; }
.facts li, .facts li + li { padding: var(--space-6); border: 0; border-radius: 0; background: none; }
.facts li + li { border-left: 1px solid var(--line-200); }
.facts li:first-child { padding-left: 0; }

/* 섹션 제목: 설명(서브타이틀)은 제목 바로 아래. PC는 문장 단위 줄바꿈(br-d), 좁은 화면은 자연 줄바꿈 */
.p-head { display: block; }
.p-head p { margin-top: var(--space-3); max-width: none; padding: 0; }
.blk-h { display: block; }
.blk-h p { margin-top: var(--space-1); }
@media (max-width: 1023px) { .br-d { display: none; } }

/* 선수 프로필 (4 vs 4 보드, 지난해 스코어보드 공용) */
.pf-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); margin: 0; padding: var(--space-6); list-style: none; }
.pf-list .pf { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); min-width: 0; padding: 0; border: 0; background: none; text-align: center; }
.pf-ph { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 50%; overflow: hidden; background: #eef0f3; color: #8d97ab; box-shadow: 0 0 0 2px rgba(255, 255, 255, .16); }
.pf-ph img { width: 100%; height: 100%; object-fit: cover; }
.pf-ph svg { width: 58%; height: 58%; margin-top: 18%; }
.pf.is-cap .pf-ph { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 75%, #fff); }
.pf-tx { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pf-list .pf-tx b { font: 700 17px/23px var(--font-sans); color: #fff; white-space: normal; overflow: visible; }
.pf-list .pf-rk { font: 600 14px/20px var(--font-sans); color: rgba(255, 255, 255, .72); font-variant-numeric: tabular-nums; }
.pf-tx em { margin-top: 2px; font: 700 12px/16px var(--font-sans); font-style: normal; color: color-mix(in srgb, var(--tc) 55%, #fff); }
.pf-list.is-sm { gap: var(--space-2); padding: var(--space-4) var(--space-6) var(--space-6); }
.pf-list.is-sm .pf-ph { width: 60px; height: 60px; }
.pf-list.is-sm .pf-tx b { font-size: 15px; line-height: 21px; }
.pf-list.is-sm .pf-rk { font-size: 13px; }
.matchup .pf-list { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; }
.matchup .pf-ph { color: #8d97ab; }
@media (max-width: 767px) {
  .pf-list, .matchup .pf-list { gap: var(--space-2); padding: var(--space-4); }
  .pf-ph { width: 60px; height: 60px; }
  .pf-list .pf-tx b { font-size: 14px; line-height: 19px; }
  .pf-list .pf-rk { font-size: 12px; line-height: 17px; }
  .pf-list.is-sm .pf-ph { width: 52px; height: 52px; }
  .f-roster { grid-template-columns: minmax(0, 1fr); }
  .f-roster .pf-list + .pf-list { border-left: 0; border-top: 1px solid rgba(255, 255, 255, .12); }
}
.f-roster { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid rgba(255, 255, 255, .12); }
.f-roster .pf-list + .pf-list { border-left: 1px solid rgba(255, 255, 255, .12); }
.fteam .fm { color: rgba(255, 255, 255, .6); }

/* 대회 일정: 두 카드의 제목·설명·형식·출전·편성 줄 높이를 맞춤 (subgrid) */
@media (min-width: 1024px) {
  .events { row-gap: 0; }
  .event { display: grid; grid-template-rows: subgrid; grid-row: span 6; }
  .event-body { display: contents; }
  .event-body > h3 { padding: var(--space-6) var(--space-6) 0; }
  .event-body > p { padding: var(--space-3) var(--space-6) 0; }
  .event-body dl { grid-row: span 3; grid-template-rows: subgrid; row-gap: var(--space-2); margin: var(--space-4) var(--space-6) var(--space-6); padding-top: var(--space-3); }
}
/* 카드 공통 모서리 12px, 그라데이션 없는 단색 */
.course, .steps li, .event, .good { border-radius: var(--r-card); }
.good { background: var(--surface-100); }
.good .ph { border-radius: 8px; background: #fff; }

/* 대회 정보: 골프채널 게임스 열만 네이비 면 */
.cmp { border-collapse: separate; border-spacing: 0; }
.cmp thead th { padding-top: var(--space-4); padding-bottom: var(--space-4); vertical-align: bottom; }
.cmp thead th.is-gcg { padding: var(--space-4) var(--space-6); border-radius: var(--r-card) var(--r-card) 0 0; background: var(--navy-3); color: #fff; font-weight: 800; }
.cmp td.is-gcg { background: var(--navy); border-top-color: rgba(255, 255, 255, .1); }
.cmp tbody tr:first-child td.is-gcg { border-radius: 0; }
.cmp tbody tr:last-child td.is-gcg { border-radius: 0 0 var(--r-card) var(--r-card); }
/* 경기 시간: 카드 대신 한 줄 타임라인 (점과 선) */
.when { position: relative; gap: 0; padding-top: 36px; border-radius: 0; background: none; overflow: visible; }
.when::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line-300); }
.when li, .when li + li { position: relative; padding: 0 var(--space-6) 0 0; border: 0; border-radius: 0; background: none; }
.when li::before { content: ""; position: absolute; top: -36px; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-100); border: 2px solid var(--text-250); box-sizing: border-box; }
.when li.is-now::before { background: var(--brand); border-color: var(--brand); }
.when li.is-now .d { color: var(--brand); }
main.promo .when li.is-now .d { color: var(--brand); }
.when .sng-btn { background: var(--brand); color: #fff; }
main.promo .when .d { font: 800 40px/1 var(--font-sans); letter-spacing: -1.2px; color: var(--text-100); }
main.promo .when li.is-now .d { color: var(--brand); }
main.promo .when .d small { font: 700 18px/1 var(--font-sans); color: var(--text-200); }
/* 경기 규칙: 카드 격자 대신 프로그램북 같은 표 형식 목록 */
.rules { display: block; border-top: 2px solid var(--text-100); }
.rule, main.promo .rule { display: grid; grid-template-columns: 220px minmax(0, 1fr) 200px; align-items: baseline; gap: var(--space-6); padding: var(--space-6) 0; border: 0; border-bottom: 1px solid var(--line-200); border-radius: 0; background: none; }
.rule > div { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.rule .tag { height: auto; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; font: 700 14px/1.3 var(--font-sans); letter-spacing: .2px; }
.rule .tag.t-y26 { color: var(--brand); }
.rule .tag.t-new { color: var(--text-100); }
.rule .tag.t-y25 { color: var(--text-250); }
.rule .spec, main.promo .rule .spec { margin: 0; padding: 0; border: 0; text-align: right; color: var(--text-100); }
.rule p { max-width: 40em; }

/* 지난해 결과: 중계 스코어 그래픽. 팀 색은 양 끝 굵은 막대로만 */
/* 스코어 그래픽: 팀 판(팀 색 단색에 문장) · 팀명 · 점수 | 연장 | 점수 · 팀명 · 팀 판 */
.final { gap: 0; padding: 0; overflow: hidden; border: 0; border-radius: 4px; background: var(--navy); align-items: stretch; }
.fteam { grid-template-columns: 96px minmax(0, 1fr) auto; column-gap: var(--space-6); align-items: center; padding-right: var(--space-6); }
.fteam .plate { grid-column: 1; grid-row: 1 / span 2; align-self: stretch; display: grid; place-items: center; min-height: 128px; background: var(--tc); }
.fteam .crest { width: 52px; height: 58px; }
.fteam .fn { grid-column: 2; } .fteam .fm { grid-column: 2; } .fteam .fs { grid-column: 3; }
.fteam.is-r { grid-template-columns: auto minmax(0, 1fr) 96px; padding-right: 0; padding-left: var(--space-6); }
.fteam.is-r .plate { grid-column: 3; } .fteam.is-r .fn, .fteam.is-r .fm { grid-column: 2; } .fteam.is-r .fs { grid-column: 1; }
.fmid { align-self: center; margin: 0 var(--space-4); }
.fteam.is-lose .fs, .fteam.is-lose .fn { color: rgba(255, 255, 255, .55); }
.fmid { background: none; border: 1px solid rgba(255, 255, 255, .3); border-radius: 8px; }
.fmid b, .fmid span, main.promo .fmid span { color: #fff; }
.prog { border-collapse: collapse; }
.prog tbody th, .prog tbody td { background: none; border-bottom: 1px solid var(--line-200); }
.prog tr.is-po th, .prog tr.is-po td { background: var(--navy); border-bottom: 0; }
.tm { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-100); font-weight: 700; white-space: nowrap; }
.tm::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--tc); }

/* 대회 일정: 대회별 단색 머리 */
.event { border: 1px solid var(--line-200); }
.event-top { border-bottom: 0; }
.ev-gcg .event-top { background: var(--navy); }
.ev-pnc .event-top { background: var(--navy-3); }
.event-dd { color: rgba(255, 255, 255, .75); }
.event-date span { color: rgba(255, 255, 255, .85); }

/* 시청 안내: 네이비 단색 밴드 */
#broadcast { background: var(--navy-2); }
.tours { border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--r-card); background: transparent; }
.tours li + li { border-left-color: rgba(255, 255, 255, .14); }
#broadcast .watch { background: var(--brand); border-color: var(--brand); }
#broadcast .watch .ext { color: #fff; }
#broadcast .watch .play circle { fill: #fff; } #broadcast .watch .play path { fill: var(--brand); }

@media (max-width: 1023px) {
  .facts li:nth-child(3), .facts li:first-child { padding-left: 0; }
  .facts li:nth-child(3) { border-left: 0; }
  .facts li:nth-child(n+3) { border-top: 1px solid var(--line-200); }
  .matchup { grid-template-columns: minmax(0, 1fr); }
  .vs { flex-direction: row; justify-content: center; gap: var(--space-3); padding: var(--space-3); }
  .vs b { font-size: 28px; }
  main.promo .rule { grid-template-columns: 180px minmax(0, 1fr); }
  main.promo .rule .spec { grid-column: 2; text-align: left; }
}
@media (max-width: 767px) {
  .facts li, .facts li + li { padding: var(--space-4) var(--space-4) var(--space-4) 0; }
  .facts li:nth-child(2) { padding-left: var(--space-4); }
  .side-h { padding: var(--space-3) var(--space-4); }
  .side-h .crest { width: 36px; height: 41px; }
  .p-head { display: block; }
  .cmp, .cmp tbody, .cmp thead { display: block; }
  .cmp colgroup { display: none; }
  .cmp thead tr, .cmp tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cmp thead th:first-child { display: none; }
  .cmp tbody th { grid-column: 1 / -1; padding: var(--space-3) 0 var(--space-1); white-space: nowrap; border-top: 1px solid var(--line-200); }
  .cmp td { border-top: 0; padding: var(--space-2) var(--space-3) var(--space-3); }
  .cmp td:not(.is-gcg) { padding-left: 0; }
  .cmp tbody tr:first-child td.is-gcg { border-radius: 0; }
  .lineup-panel .team li .ic, .lineup-panel .team li.on .sng-check-box { width: 40px; height: 40px; font-size: 15px; }
  .lineup-panel .team li.on .sng-check-box::after { width: 13px; height: 6px; }
  /* 타임라인은 세로로 */
  .when { padding: 0 0 0 32px; gap: var(--space-6); }
  .when::before { left: 7px; right: auto; top: 6px; bottom: 6px; width: 2px; height: auto; }
  .when li, .when li + li { padding: 0; border: 0; }
  .when li::before { top: 2px; left: -32px; }
  main.promo .rule { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); padding: var(--space-4) 0; }
  main.promo .rule .spec { grid-column: auto; }
  .rule > div { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: var(--space-3); }
  .final { padding: 0; }
  .fteam, .fteam.is-r { grid-template-columns: 44px minmax(0, 1fr); column-gap: var(--space-2); padding: var(--space-4); }
  .fteam .plate, .fteam.is-r .plate { grid-column: 1; grid-row: 1; min-height: 0; width: 44px; height: 50px; border-radius: 4px; }
  .fteam .crest { width: 30px; height: 34px; }
  .fmid { margin: 0 var(--space-4) var(--space-4); }
  .fteam .fn, .fteam.is-r .fn { grid-column: 2; grid-row: 1; text-align: left; justify-content: flex-start; flex-wrap: wrap; row-gap: 4px; white-space: nowrap; }
  .fn .win { order: -1; height: 22px; font-size: 12px; }
  .fteam .fs, .fteam.is-r .fs { grid-column: 1 / -1; grid-row: 2; text-align: left; }
  .fteam .fm, .fteam.is-r .fm { grid-column: 1 / -1; grid-row: 3; text-align: left; }
  main.promo .when .d { font-size: 32px; }
}
/* =========================================================
   [Ver.2] 이벤트 우선 레이아웃 (참고: 친구초대 이벤트 v2 디자인 시안)
   고정: 공식 로고 · 키컬러 #ff4600 · Pretendard
   ========================================================= */
main.v2 { background: #000; }
main.v2 .p-sec { border-top: 1px solid #1f1f1f; background: #000; }
main.v2 .p-sec.is-alt { background: #0a0a0a; }
.demo-bar .ver { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-2); border-radius: var(--radius-tag); background: var(--bg-100); color: var(--text-100); font: 800 12px/1 var(--font-sans); }
.demo-bar .ph-sel { display: inline-flex; align-items: center; gap: var(--space-2); margin-left: var(--space-3); font-weight: 700; }
.demo-bar .ph-sel select { height: 24px; padding: 0 var(--space-2); border: 1px solid var(--bg-100); border-radius: var(--radius-tag); background: #fff; color: var(--bg-100); font: 700 13px/1 var(--font-sans); cursor: pointer; }

/* 공통 조각: 태그, 섹션 머리 */
.v2-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--space-2); border-radius: var(--radius-tag); background: var(--brand); color: #fff; font: 800 13px/1 var(--font-sans); white-space: nowrap; }
.v2-tag.is-line { background: transparent; color: var(--text-150); box-shadow: inset 0 0 0 1px var(--line-400); font-weight: 700; }
main.v2 .v2-head { display: block; margin-bottom: var(--space-12); }
main.v2 .v2-head .v2-eyebrow { margin-top: 0; padding: 0; font: 800 16px/1 var(--font-sans); letter-spacing: 0.5px; color: var(--brand); margin-bottom: var(--space-3); }
main.v2 .v2-head h2 { font: 800 40px/1.25 var(--font-sans); letter-spacing: -1.3px; white-space: normal; text-wrap: balance; }
main.v2 .v2-head p:not(.v2-eyebrow) { max-width: none; margin-top: var(--space-3); padding: 0; font: 400 19px/29px var(--font-sans); color: var(--text-200); }

/* ---------- 히어로: 이벤트명 · 내용 · CTA 먼저 ---------- */
.v2-hero { background: #0a0a0a; border-bottom: 1px solid #1f1f1f; overflow: hidden; }
.v2-hero-in { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); align-items: center; gap: var(--space-12); padding-top: 72px; padding-bottom: 80px; }
.v2-copy { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-6); min-width: 0; }
.v2-period { display: inline-flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-3); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--brand); color: #fff; font: 800 18px/1.3 var(--font-sans); }
.v2-period .k { font-weight: 600; opacity: .9; }
.v2-period .dd { padding-left: var(--space-3); border-left: 1px solid rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }
.v2-eye { font: 700 19px/1.4 var(--font-sans); color: var(--text-100); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line-400); }
.v2-title { font: 900 64px/1.15 var(--font-sans); letter-spacing: -2.4px; color: var(--text-100); }
.v2-title em { font-style: normal; color: var(--brand); }
.v2-lede { font: 400 20px/1.65 var(--font-sans); color: var(--text-200); }
.v2-lede b { color: var(--text-100); font-weight: 700; }
/* 응모 흐름 3칸: 친구 3명 → 4명 팀 → 라운드권 */
.v2-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; max-width: 560px; list-style: none; border-radius: var(--radius-md); border: 1px solid var(--line-400); overflow: hidden; }
.v2-flow li { position: relative; display: flex; flex-direction: column; gap: 2px; padding: var(--space-3) var(--space-4); }
.v2-flow li + li { border-left: 1px solid var(--line-400); }
.v2-flow li + li::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: #0a0a0a; border-top: 1px solid var(--line-400); border-right: 1px solid var(--line-400); transform: translateY(-50%) rotate(45deg); }
.v2-flow b { font: 800 19px/1.3 var(--font-sans); color: var(--text-100); white-space: nowrap; }
.v2-flow span { font: 500 16px/1.4 var(--font-sans); color: var(--text-250); }
.v2-flow .is-goal { background: color-mix(in srgb, var(--brand) 16%, #0a0a0a); }
.v2-flow .is-goal::before { background: #0a0a0a; }
.v2-flow .is-goal b { color: #ff7a45; }
.v2-act { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); width: 100%; }
.v2-act .cta-pill { min-width: min(100%, 440px); min-height: 68px; font-size: 21px; }
.v2-act .cta-help { margin: 0; font: 400 16px/24px var(--font-sans); color: var(--text-250); }
.cta-pill.is-off, .cta-pill:disabled { background: var(--surface-200); color: var(--text-disabled-cta); cursor: not-allowed; box-shadow: none; }

/* 이벤트 이미지: 골프장 사진 + 4명 팀 + 라운드권 티켓 */
.v2-visual { position: relative; aspect-ratio: 5 / 5.4; border-radius: 16px; overflow: hidden; background: #141414; isolation: isolate; }
.v2-visual .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
.v2-visual::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.05) 38%, rgba(0,0,0,.1) 60%, rgba(0,0,0,.72) 100%); }
.squad { position: absolute; top: 9%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 34px; }
.squad .row, .squad.sm { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; }
.squad .av { position: relative; display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: #21c7a8; }
.squad .av svg { width: 28px; height: 28px; }
.squad .av i { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font: 700 14px/1 var(--font-sans); font-style: normal; color: #fff; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.squad .av.is-me { width: 74px; height: 74px; background: var(--brand); }
.squad .av.c2 { background: #7b6cff; }
.squad .av.c3 { background: #ffb020; }
.squad .dash { width: 32px; border-top: 2px dashed rgba(255,255,255,.7); }
.squad .done { padding: 8px 16px; border-radius: var(--radius-full); background: #fff; color: #000; font: 800 15px/1 var(--font-sans); }
.ticket { position: absolute; left: 50%; bottom: 13%; width: min(84%, 380px); display: flex; transform: translateX(-50%) rotate(-5deg); filter: drop-shadow(0 14px 22px rgba(0,0,0,.45)); }
.ticket .tl { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; background: var(--brand); border-radius: 14px 0 0 14px; border-right: 2px dashed rgba(255,255,255,.55); }
.ticket .tl .k { font: 800 12px/1 var(--font-sans); letter-spacing: 3px; color: rgba(255,255,255,.85); }
.ticket .tl b { font: 900 30px/1.1 var(--font-sans); letter-spacing: -1px; color: #fff; }
.ticket .tl .s { font: 600 14px/1.3 var(--font-sans); color: rgba(255,255,255,.9); }
.ticket .tr { width: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border-radius: 0 14px 14px 0; color: var(--brand); }
.ticket .tr b { font: 900 40px/1 var(--font-sans); }
.ticket .tr span { font: 800 13px/1 var(--font-sans); letter-spacing: 1px; }
.v2-visual .cap { position: absolute; right: 12px; bottom: 10px; padding: 2px 8px; border-radius: var(--radius-xs); background: rgba(0,0,0,.5); font: 400 12px/16px var(--font-sans); color: var(--text-150); }

/* 대회 LIVE 띠 (게임스·PNC 생중계 날) */
.v2-live { background: #1a0d08; border-bottom: 1px solid #3a2216; }
.v2-live-in { display: flex; align-items: center; gap: var(--space-4); min-height: 76px; padding-top: var(--space-3); padding-bottom: var(--space-3); }
.v2-live .lv, .v2-gbtn .lv { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius-tag); background: var(--live); color: #fff; font: 900 13px/1 var(--font-sans); }
.v2-live p { flex: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px var(--space-3); min-width: 0; }
.v2-live p b { font: 700 19px/1.3 var(--font-sans); color: #fff; }
.v2-live p span { font: 400 16px/1.4 var(--font-sans); color: var(--text-250); }

/* ---------- 경품 ---------- */
.v2-prz-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-3); }
.v2-prz-h + .v2-courses { margin-top: 0; }
.v2-goods + .v2-odds { margin-top: var(--space-3); }
.v2-courses + .v2-prz-h { margin-top: 36px; }
.v2-prz-h h3 { font: 800 22px/1.3 var(--font-sans); letter-spacing: -0.8px; color: var(--text-100); }
.v2-prz-h p { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); font: 400 16px/24px var(--font-sans); color: var(--text-200); }
.v2-courses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); list-style: none; }
.v2-course { display: grid; grid-template-columns: 48% minmax(0, 1fr); align-items: stretch; border-radius: 12px; overflow: hidden; background: #141414; border: 1px solid #3a2a22; }
.v2-course .ph { position: relative; min-height: 112px; overflow: hidden; }
.v2-course .ph img { position: absolute; inset: 0; }
.v2-course img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.16, 1, .3, 1); }
.v2-course:hover img { transform: scale(1.04); }
.v2-course .src { position: absolute; right: 6px; top: 6px; padding: 1px 6px; border-radius: var(--radius-xs); background: rgba(0,0,0,.5); font: 400 11px/15px var(--font-sans); color: var(--text-150); }
.v2-course .perk { position: absolute; left: 6px; bottom: 6px; padding: 4px 8px; border-radius: var(--radius-full); background: rgba(0,0,0,.8); font: 700 12px/1 var(--font-sans); color: #fff; }
.v2-course .bd { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: var(--space-3) var(--space-4); }
.v2-course .nm { margin: 0; font: 800 22px/1.2 var(--font-sans); letter-spacing: -0.6px; color: var(--text-100); }
.v2-course .ct { font: 600 15px/1.3 var(--font-sans); color: #ff7a45; }
.v2-course .ct b { font-weight: 800; }
.v2-goods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); list-style: none; }
.v2-good { display: grid; grid-template-columns: 80px minmax(0, 1fr); align-items: center; gap: var(--space-3); padding: var(--space-3); border-radius: 12px; background: #141414; border: 1px solid #262626; }
.v2-good .ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--text-200); display: grid; place-items: center; }
.v2-good .ph img, .v2-good .ph svg { width: 100%; height: 100%; object-fit: contain; display: block; }
.v2-good .nm { font: 700 17px/1.35 var(--font-sans); letter-spacing: -0.4px; color: var(--text-100); }
.v2-good .sub { font: 400 14px/20px var(--font-sans); color: var(--text-250); }
.v2-good .ct { margin-top: 2px; font: 800 26px/1.1 var(--font-sans); letter-spacing: -1px; color: var(--text-100); font-variant-numeric: tabular-nums; }
.v2-good .ct small { margin-left: 2px; font: 700 15px/1 var(--font-sans); color: var(--text-250); }
.v2-good .ex { font: 400 12px/17px var(--font-sans); color: var(--text-300); }
.v2-odds { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-2) var(--space-4); padding: var(--space-4) var(--space-6); border-radius: 12px; background: #1a120d; border: 1px solid #5a3a20; }
.v2-odds .k { font: 800 16px/1.3 var(--font-sans); color: #ff7a45; white-space: nowrap; }
.v2-odds .v { font: 400 17px/1.5 var(--font-sans); color: var(--text-200); }
.v2-odds .v b { color: #fff; }
.v2-odds .s { font: 400 14px/1.4 var(--font-sans); color: var(--text-300); white-space: nowrap; }

/* ---------- 참여 방법: 내 팀 현황 ---------- */
.v2-team { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); align-items: center; gap: var(--space-12); padding: 36px 40px; border-radius: 16px; background: #121212; border: 1px solid #2a2a2a; }
.v2-team-l { min-width: 0; }
.v2-team .lt-head h3 { font: 700 22px/1.3 var(--font-sans); color: var(--text-100); }
.v2-team .lt-count b { color: #ff7a45; }
.v2-team-msg { margin-top: var(--space-3); font: 800 23px/1.45 var(--font-sans); letter-spacing: -0.5px; color: var(--text-100); }
.v2-team-sub { margin-top: var(--space-2); font: 400 17px/1.55 var(--font-sans); color: var(--text-250); }
.v2-team-cta { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); margin-top: var(--space-6); }
.v2-team-cta .cta-help { margin: 0; font-size: 16px; }
.v2-slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); list-style: none; }
.v2-slots li { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); padding: var(--space-3) var(--space-2); border-radius: 12px; border: 1px dashed #4a4a4a; text-align: center; }
.v2-slots .ic { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 1px dashed #6a6a6a; color: var(--text-200); font: 700 17px/1 var(--font-sans); }
.v2-slots b { font: 700 16px/1.3 var(--font-sans); color: var(--text-150); }
.v2-slots small { font: 400 14px/1.3 var(--font-sans); color: var(--text-300); }
.v2-slots li.on { border: 1px solid var(--brand); background: #2a1a12; }
.v2-slots li.on .ic { border: 0; background: var(--brand); color: #fff; }
.v2-slots li.on b { color: #fff; }
.v2-slots li.on small { color: #ffb08a; }
.v2-slots li.on .sng-check-box { width: 48px; height: 48px; background: var(--brand); border-color: var(--brand); }
.v2-slots li.on .sng-check-box::after { width: 14px; height: 7px; border-width: 0 0 2.5px 2.5px; border-color: #fff; }

/* 친구 초대 방법 4단계 */
.v2-blk { margin-top: 72px; }
.v2-blk-h { margin-bottom: var(--space-4); font: 800 28px/1.25 var(--font-sans); letter-spacing: -0.8px; color: var(--text-100); }
.v2-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); list-style: none; }
.v2-steps li { display: flex; flex-direction: column; min-width: 0; border-radius: 14px; overflow: hidden; background: #141414; border: 1px solid #2a2a2a; }
.v2-steps .no { padding: 10px 18px; background: var(--brand); color: #fff; font: 900 15px/1.2 var(--font-sans); letter-spacing: 1px; }
.v2-steps .st-art { aspect-ratio: 16 / 10; }
.v2-steps .bd { display: flex; flex-direction: column; gap: var(--space-2); padding: 18px 20px 22px; }
.v2-steps h4 { margin: 0; font: 800 20px/1.4 var(--font-sans); letter-spacing: -0.4px; color: var(--text-100); }
.v2-steps h4 em { font-style: normal; color: #ff7a45; }
.v2-steps p { font: 400 16px/1.6 var(--font-sans); color: var(--text-200); }
.v2-steps .v2-fn { font: 400 14px/1.5 var(--font-sans); color: var(--text-300); }
/* 응모 규칙표 */
.v2-rule { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; border-radius: 14px; overflow: hidden; border: 1px solid #2a2a2a; background: #121212; }
.v2-rule col.c1 { width: 24%; }
.v2-rule th, .v2-rule td { padding: 18px 22px; text-align: left; vertical-align: top; border-top: 1px solid #262626; }
.v2-rule thead th { border-top: 0; background: #181818; font: 800 18px/1.35 var(--font-sans); color: var(--text-100); }
.v2-rule th small, .v2-rule td small { display: block; margin-top: 2px; font: 400 14px/1.4 var(--font-sans); color: var(--text-300); }
.v2-rule tbody th { font: 700 18px/1.4 var(--font-sans); color: var(--text-100); }
.v2-rule td { font: 400 16px/1.55 var(--font-sans); color: var(--text-250); }
.v2-rule td b { display: block; margin-bottom: 2px; font: 800 18px/1.4 var(--font-sans); color: var(--text-100); }
.v2-rule td b.ok { color: #ff7a45; }
.v2-rule tr.is-bonus th, .v2-rule tr.is-bonus td { background: #1a120d; }
.v2-rule tr.is-bonus td b { margin: 0; color: #fff; }
.v2-center { display: flex; justify-content: center; margin-top: var(--space-12); }
.v2-center .cta-pill { min-width: min(100%, 480px); }

const KEY = 'golfInviteDemo.ver2';
/* 초대 규칙: 초대한 사람(A) + 친구 3명 = 한 팀(4명). A는 최대 3명까지 초대할 수 있고,
   3명이 가입을 마치면 자동 응모되며 A의 초대코드는 마감(비활성화)됩니다. */
const MAX_INVITES = 3;
const TEAM_SIZE = MAX_INVITES + 1;
const DEFAULT = { users: [], session: null, loginMode: 'both', winnerScope: 'rep', eventEnd: '2027-01-17', savedEmail: '', phase: 'pre' };
let db = load();
function load(){ try { const r = JSON.parse(localStorage.getItem(KEY)); return r ? { ...DEFAULT, ...r } : structuredClone(DEFAULT); } catch (e) { return structuredClone(DEFAULT); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

const me = () => db.users.find(u => u.id === db.session) || null;
const byCode = c => db.users.find(u => u.code && u.code === (c || '').trim().toUpperCase()) || null;
const invitees = u => db.users.filter(x => x.referredBy && x.referredBy === u.code).sort((a, b) => a.createdAt - b.createdAt);
/* 초대코드 상태: none(입력 없음) · invalid(없는 코드) · expired(기간 만료) · closed(3명 마감) · valid */
function codeState(c){
  const v = (c || '').trim().toUpperCase();
  if (!v) return { state: 'none', user: null };
  const u = byCode(v);
  if (!u) return { state: 'invalid', user: null };
  if (u.codeExpired) return { state: 'expired', user: u };
  if (phase() === 'end') return { state: 'ended', user: u };
  if (invitees(u).length >= MAX_INVITES) return { state: 'closed', user: u };
  return { state: 'valid', user: u };
}
/* Ver.2 회의 확정: 라운드권은 초대코드를 만든 대표자에게 지급(대표자 팀 4명 이용) */
const WINNER = { all: '팀원 4명 모두', rep: '대표자' };
const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'h' + h; }; // demo only, not security
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Names are masked after the first character (UserMenu rule): 홍** */
const maskName = n => { n = String(n || ''); return n.length <= 1 ? n : n[0] + '*'.repeat(n.length - 1); };
const DOW = '일월화수목금토';
const pad = n => String(n).padStart(2, '0');
const fmtDay = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}(${DOW[d.getDay()]})`;
const fmt = t => { const d = new Date(t); return `${fmtDay(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const endLabel = () => { const [y, m, d] = db.eventEnd.split('-').map(Number); return fmtDay(new Date(y, m - 1, d)); };
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function genCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c; do { c = 'GN' + Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (byCode(c));
  return c;
}

/* Sign-up: 유효한 코드일 때만 초대자 팀에 +1. 마감·만료·잘못된 코드는 일반 가입으로 처리(가입은 막지 않음) */
function createUser({ name, email, pw, phone, ref, via = 'web', marketing = false, extra = {} }){
  const cs = codeState(ref);
  const referrer = cs.state === 'valid' ? cs.user : null;
  const u = { id: 'u' + Date.now() + Math.random().toString(36).slice(2, 6), name, email, pw: pw ? hash(pw) : null, phone,
              code: null, referredBy: referrer ? referrer.code : null, via, marketing, createdAt: Date.now(), entered: false, enteredAt: null, ...extra };
  db.users.push(u);
  if (referrer) checkEntry(referrer);
  save();
  return u;
}
/* 친구 3명이 모이면(4명 1팀) 자동 응모 + 코드 마감 */
function checkEntry(u){
  if (!u.entered && invitees(u).length >= MAX_INVITES){ u.entered = true; u.enteredAt = Date.now(); return true; }
  return false;
}
/* 데모용 샘플 초대자: 가입 분기(유효/마감/만료) 미리보기에 사용 */
const SEEDS = [
  { code: 'GNTEAM01', name: '김민수', friends: ['오세훈'] },
  { code: 'GNFULL03', name: '박지훈', friends: ['한도윤', '서지우', '문채원'] },
  { code: 'GN25PAST', name: '이수진', friends: [], codeExpired: true }
];
function ensureSeeds(){
  SEEDS.forEach((s, si) => {
    if (byCode(s.code)) return;
    const t = Date.now() - 86400000 * (5 - si);
    db.users.push({ id: 'seed' + si, name: s.name, email: `seed${si}@demo`, pw: null, phone: '', code: s.code, referredBy: null, via: 'seed', createdAt: t, entered: false, enteredAt: null, codeExpired: !!s.codeExpired });
    s.friends.forEach((n, i) => db.users.push({ id: `seed${si}f${i}`, name: n, email: `seed${si}f${i}@demo`, pw: null, phone: '', code: null, referredBy: s.code, via: 'seed', createdAt: t + 3600000 * (i + 1), entered: false, enteredAt: null }));
    const u = byCode(s.code); if (checkEntry(u)) u.enteredAt = t + 3600000 * 4;
  });
  save();
}
/* Invite code: issued once, the first time a logged-in user opens 마이 */
function ensureCode(u){ if (!u.code){ u.code = genCode(); save(); } return u.code; }

function parse(){
  const h = location.hash.slice(1) || '/';
  const [path, q] = h.split('?');
  return { path, q: Object.fromEntries(new URLSearchParams(q || '')) };
}
function go(p){ if (location.hash.slice(1) === p) render(); else location.hash = p; }
window.addEventListener('hashchange', () => { if (parse().path === '/signup') su = null; render(); });

const routes = { '/': Promo, '/login': Login, '/signup': Signup, '/my': My };
let pendingScroll = null;
function render(){
  const { path, q } = parse();
  if (path === '/my' && !me()) return go('/login?next=/my');
  /* 예전 초대 링크(#/i/CODE)는 회원가입 페이지로 넘깁니다. */
  if (path.startsWith('/i/')) return go('/signup?ref=' + encodeURIComponent(decodeURIComponent(path.slice(3))));
  let fn = routes[path];
  if (!fn) fn = Promo;
  const out = fn(q);
  const sel = document.getElementById('phaseSel');
  if (sel){ if (!sel.options.length) sel.innerHTML = PHASES.map(([v, l]) => `<option value="${v}">${l}</option>`).join(''); sel.value = phase(); }
  dockObs?.disconnect(); dockObs = null;
  spyObs?.disconnect(); spyObs = null;
  document.getElementById('view').innerHTML = out.html;
  document.body.classList.toggle('has-mcta', !!out.mcta);
  document.body.classList.toggle('has-dock', !!out.dock);
  window.scrollTo(0, 0);
  out.after?.();
  if (pendingScroll){ const el = document.getElementById(pendingScroll); pendingScroll = null; el?.scrollIntoView(); }
}

/* 서브메뉴 현재 위치 표시: 화면 가운데 근처에 있는 섹션을 켭니다. */
let spyObs = null;
function setupSpy(){
  const links = [...document.querySelectorAll('.subnav a[data-sec]')];
  if (!links.length || !('IntersectionObserver' in window)) return;
  const map = { intro: null, how: 'how', prizes: 'prizes', games: 'games', notice: 'notice' };
  spyObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const key = map[e.target.id];
    links.forEach(a => { const on = a.dataset.sec === key; a.classList.toggle('is-on', on); on ? a.setAttribute('aria-current', 'location') : a.removeAttribute('aria-current'); });
  }), { rootMargin: '-45% 0px -50% 0px' });
  ['intro', 'prizes', 'how', 'games', 'notice'].forEach(id => { const el = document.getElementById(id); if (el) spyObs.observe(el); });
}
function toggleMenu(force){
  const m = document.getElementById('mMenu'), b = document.getElementById('menuBtn');
  if (!m) return;
  const open = force ?? m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', String(open));
}
function closeMenu(){ toggleMenu(false); }

  const cta = document.getElementById('heroCta'), dock = document.getElementById('dock');

      <p class="kv-foot">이벤트 기간 2026.12.14(월) ~ 2027.01.17(일) · SPOTV NOW Golf</p>
    </div>
    <div class="sng-login-panel">
      <div class="sng-form is-panel">
        <div class="sng-login-logo">${wordmark()}</div>
        <h1 class="login-title">로그인</h1>
        <p class="login-desc">로그인하면 나만의 초대코드가 바로 발급됩니다.<br>계정이 없다면 회원가입 후 바로 시작할 수 있어요.</p>
        ${mode !== 'web' ? appBlock : ''}
        ${mode === 'both' ? '<p class="or">또는 웹에서 로그인</p>' : ''}
        ${mode !== 'app' ? webBlock : ''}
        <button type="button" class="sng-cta sng-cta-outline" onclick="go('/signup?next=${encodeURIComponent(next)}')">회원가입</button>
      </div>
    </div>
  </main>`;
  return { html, after: () => { const f = document.querySelector('.login-page form'); if (f) loginValid(f); } };
}
function loginValid(f){
  const ok = f.email.value.trim() && f.pw.value;
  document.getElementById('lgSubmit').disabled = !ok;
}
function togglePw(btn){
  const i = document.getElementById(btn.getAttribute('aria-controls'));
  const show = i.type === 'password'; i.type = show ? 'text' : 'password';
  btn.textContent = show ? '숨기기' : '보기'; btn.setAttribute('aria-pressed', String(show));
}
function notInDemo(){ alertModal('알림', '데모에서는 제공하지 않는 기능입니다.'); }
function webLogin(e, next){
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim().toLowerCase();
  const u = db.users.find(x => x.email === email);
  if (!u || u.pw !== hash(f.pw.value)){
    document.getElementById('lgErr').textContent = '이메일 또는 비밀번호가 일치하지 않습니다. 데모에서는 먼저 회원 가입을 해 주세요.';
    return false;
  }
  db.savedEmail = f.saveEmail.checked ? email : '';
  db.session = u.id; save(); toast(`${maskName(u.name)} 님, 환영합니다.`); go(next); return false;
}
function appLogin(next){
  modal({ title: '앱 인증', body: `<div><div class="spinner" aria-hidden="true"></div><p>SPOTV NOW Golf 앱에서 인증하고 있습니다.</p><p class="help" style="margin-top:var(--space-2)">실서비스: 딥링크로 앱 실행 → 앱 로그인 → 토큰과 함께 웹으로 복귀. 앱이 없으면 스토어로 이동합니다.</p></div>`,
          buttons: [{ label: '취소', onclick: 'closeModal()' }], id: 'appAuth' });
  setTimeout(() => {
    if (!document.getElementById('appAuth')) return;
    let u = db.users.find(x => x.via === 'app-demo');
    if (!u) u = createUser({ name: '앱회원', email: 'app.member@demo', pw: null, phone: '', via: 'app-demo' });
    db.session = u.id; save(); closeModal(); toast('앱 인증이 완료되었습니다. (데모 계정)'); go(next);
  }, 1600);
}

function stepper(n){

  return `<ol class="sng-steps">${names.map((t, i) => `<li class="${i + 1 < n ? 'is-done' : i + 1 === n ? 'is-current' : ''}" aria-label="${i + 1}단계 ${t}${i + 1 < n ? ' 완료' : ''}" ${i + 1 === n ? 'aria-current="step"' : ''}></li>`).join('')}</ol>`;

function Signup(q){
  const ref = (q.ref || '').trim().toUpperCase();

    const cs = codeState(ref);
    su = { step: 1, terms: { tos: false, privacy: false, mkt: false }, data: { ref: cs.state === 'valid' ? ref : '' }, entry: { code: ref, state: cs.state }, next: q.next || '/my', result: null };

function checkRef(el){
  const v = el.value.trim().toUpperCase(); const h = document.getElementById('refHint');
  h.className = 'f-msg';

/* 초대코드는 가입 조건이 아닙니다. 잘못된 코드여도 가입 버튼은 막지 않습니다. */
function signupValid(f){
  const ok = f.name.value.trim() && EMAIL_RE.test(f.email.value.trim()) && f.pw.value.length >= 4 &&
             f.phone.value.replace(/\D/g, '').length >= 10;
  document.getElementById('suSubmit').disabled = !ok;
}
function doSignup(e){
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim().toLowerCase();
  const phone = f.phone.value.replace(/\D/g, '');
  const ref = f.ref.value.trim().toUpperCase();
  const err = m => { document.getElementById('suErr').textContent = m; return false; };
  if (db.users.some(u => u.email === email)) return err('이미 가입된 이메일입니다. 다른 이메일을 입력해 주세요.');
  if (phone && db.users.some(u => u.phone === phone)) return err('이미 가입된 휴대폰 번호입니다. 중복 가입은 할 수 없습니다.');
  /* 제출 시점에 코드 상태를 다시 확인합니다(그사이 3명이 차서 마감될 수 있음). */
  const cs = codeState(ref);
  const referrer = cs.state === 'valid' ? cs.user : null;
  const u = createUser({ name: f.name.value.trim(), email, pw: f.pw.value, phone, ref: referrer ? ref : '', marketing: su.terms.mkt });
  db.session = u.id; save();
  su.result = { referrerId: referrer?.id, refState: cs.state };
  su.step = 3; rerenderSignup();
  toast(referrer ? `가입되었습니다. ${maskName(referrer.name)} 님의 팀에 합류했습니다.` : '가입되었습니다.');
  if (referrer?.entered) setTimeout(() => toast(`${maskName(referrer.name)} 님의 팀이 완성되어 자동 응모되었습니다.`), 2200);
  return false;
}

      <div class="sng-chips" style="margin-top:var(--space-3)">
        <button type="button" class="sng-chip" onclick="closeModal();go('/')">홍보 페이지</button>
        <button type="button" class="sng-chip" onclick="closeModal();go('/login')">로그인</button>
        <button type="button" class="sng-chip" onclick="closeModal();su=null;go('/signup')">회원가입</button>
        <button type="button" class="sng-chip" onclick="closeModal();go('/my')">내 팀 현황</button>
        ${u?.code ? `<button type="button" class="sng-chip" onclick="closeModal();su=null;go('/signup?ref=${u.code}')">내 초대 링크</button>` : ''}
      </div>
    </div>`,
    buttons: [{ label: '초기화', onclick: 'resetAll()' }, { label: '닫기', primary: true, onclick: 'closeModal()' }] });
}

/* =========================================================
   UI helpers: toast, Modal (sng-modal, role=alertdialog)
   ========================================================= */
let tt;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
let lastFocus = null;
function modal({ title, body, buttons = [{ label: '확인', primary: true, onclick: 'closeModal()' }], wide = false, id = '' }){
  lastFocus = document.activeElement;
  document.getElementById('modal').innerHTML = `
  <div class="sng-modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="sng-modal ${wide ? 'is-wide' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="mdTitle" ${id ? `id="${id}"` : ''}>
      <div class="sng-modal-head" id="mdTitle">${title}</div>
      <div class="sng-modal-body">${body}</div>
      <div class="sng-modal-foot">${buttons.map(b => `<button type="button" class="sng-modal-btn ${b.primary ? 'is-primary' : ''}" onclick="${b.onclick}">${b.label}</button>`).join('')}</div>
    </div>
  </div>`;
  const foot = document.querySelector('#modal .sng-modal-foot button:last-child');
  foot?.focus({ preventScroll: true });
}
function alertModal(title, msg){ modal({ title: esc(title), body: `<p>${esc(msg)}</p>` }); }
function closeModal(){ document.getElementById('modal').innerHTML = ''; lastFocus?.focus?.(); lastFocus = null; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (document.querySelector('#modal .sng-modal')) closeModal(); else closeMenu(); }
  if (e.key === 'Tab'){
    const m = document.querySelector('#modal .sng-modal'); if (!m) return;
    const f = [...m.querySelectorAll('button:not([disabled]),input,a[href]')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('click', e => { const m = document.getElementById('mMenu'); if (m && !m.hidden && !e.target.closest('#mMenu,#menuBtn')) closeMenu(); });

ensureSeeds(); // 샘플 초대 링크(유효/마감/만료)가 처음부터 동작하도록
render();
</script>
