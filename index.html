<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPOTV NOW Golf 친구초대 이벤트 (DEMO)</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== Design tokens (generated from ds3/project/tokens.json) ===== */
:root {
  /* color */
  --bg-000: #0c0c0c;
  --bg-100: #121212;
  --bg-200: #141414;
  --bg-300: #191919;
  --surface-100: #1e1e1e;
  --surface-150: #202020;
  --surface-200: #222222;
  --surface-300: #353535;
  --line-100: #2a2a2a;
  --line-200: #353535;
  --line-250: #2e2e2e;
  --line-300: #979797;
  --line-400: #414141;
  --line-hover: #888888;
  --text-100: #ffffff;
  --text-150: #e7e7e7;
  --text-200: #ededed;
  --text-250: #cfcfcf;
  --text-300: #9e9e9e;
  --text-350: #999999;
  --text-400: #888888;
  --text-placeholder: #757575;
  --text-disabled: #595959;
  --text-disabled-cta: #6a6a6a;
  --brand: #ff4600;
  --live: #ff0050;
  --vod: #7a43ff;
  --chip-active: #eeeeee;
  --on-brand: #ffffff;
  --brand-step-off: rgba(255, 70, 0, 0.2);
  --indicator: #d9d9d9;
  --tooltip-bg: #d8d8d8;
  --scrim-strong: rgba(0, 0, 0, 0.9);
  --scrim-soft: rgba(10, 10, 10, 0.4);
  --scrim-panel: rgba(18, 18, 18, 0.9);
  --scrim-modal: rgba(0, 0, 0, 0.5);
  --scrim-badge: rgba(0, 0, 0, 0.9);
  /* type families */
  --font-sans: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-display: "Paperlogy", Pretendard, "Apple SD Gothic Neo", sans-serif;
  /* type styles: --type-<name> is a font shorthand, --ls-<name> its letter-spacing */
  --type-display-numeral: 800 120px/1 var(--font-display);
  --ls-display-numeral: -6.48px;
  --type-page-hero: 300 40px/48px var(--font-sans);
  --type-page-heading: 700 36px/43px var(--font-sans);
  --type-headline: 700 36px/37.08px var(--font-sans);
  --ls-headline: -0.9px;
  --type-page-title: 700 24px/29px var(--font-sans);
  --type-section-title: 700 24px/32px var(--font-sans);
  --type-label-lg: 400 20px/24px var(--font-sans);
  --ls-label-lg: -0.5px;
  --type-tab-lg: 400 20px/24px var(--font-sans);
  --type-date-strip: 700 20px/24px var(--font-sans);
  --type-tab-md: 400 18px/22px var(--font-sans);
  --type-card-title: 500 16px/28px var(--font-sans);
  --ls-card-title: -0.4px;
  --type-body: 400 16px/24px var(--font-sans);
  --type-meta: 500 14px/18.06px var(--font-sans);
  --ls-meta: -0.35px;
  --type-caption: 400 13px/18px var(--font-sans);
  --type-form-label: 400 16px/24px var(--font-sans);
  --type-field: 400 15px/22.5px var(--font-sans);
  --type-helper: 400 14px/21px var(--font-sans);
  --type-form-link: 400 13px/15px var(--font-sans);
  --type-tag: 400 12px/14px var(--font-sans);
  --type-table-cell: 400 15px/28px var(--font-sans);
  --type-micro: 400 11px/16px var(--font-sans);
  --type-button-lg: 700 18px/19.98px var(--font-sans);
  --ls-button-lg: -0.45px;
  --type-button-md: 700 16px/20px var(--font-sans);
  --type-button-sm: 600 14px/18.06px var(--font-sans);
  --ls-button-sm: -0.35px;
  /* spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-12: 48px;
  --gutter: 92px;
  /* radius */
  --radius-xs: 3px;
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 13px;
  --radius-tag: 4px;
  --radius-chip: 20px;
  --radius-cta: 30px;
  --radius-pill: 35px;
  --radius-full: 999px;
  /* size */
  --control-lg: 48px;
  --control-sm: 32px;
  --header-h: 64px;
  --field-h: 50px;
  --auth-btn-h: 64px;
  --sns-btn: 48px;
  --form-w-panel: 328px;
  --form-w: 392px;
  --login-panel-w: 559px;
  --modal-w: 374px;
  --top-bar-h: 96px;
  --chip-h: 40px;
  --vod-card-w: 262px;
  --schedule-row-h: 59px;
  --tour-logo: 128px;
  --content-w: 1200px;
}
:root {
  /* page-level sizes derived from the tokens */
  --demo-h: 32px;
  --m-cta-h: calc(var(--control-lg) + var(--space-3) * 2);
}

/* ===== Component bundle (ds3/project/components/bundle.css) ===== */
body { margin: 0; font-family: var(--font-sans); background: var(--bg-100); color: var(--text-100); -webkit-font-smoothing: antialiased; }
.sng-row { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-4); flex-wrap: wrap; }

/* Button */
.sng-btn { flex: none; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }
.sng-btn-lg { height: var(--control-lg); padding: 0 var(--space-6); font-size: 18px; font-weight: 700; letter-spacing: -0.45px; }
.sng-btn-sm { height: var(--control-sm); padding: 0 var(--space-4); font-size: 14px; font-weight: 600; letter-spacing: -0.35px; }
.sng-btn-primary { background: var(--brand); color: var(--on-brand); }
.sng-btn-secondary { background: var(--surface-300); color: var(--text-100); }
.sng-btn:disabled { background: var(--surface-200); color: var(--text-disabled); cursor: not-allowed; }
.sng-btn:focus-visible { outline: 2px solid var(--text-100); outline-offset: 2px; }

/* Schedule card */
.sng-card { background: var(--surface-200); border-radius: var(--radius-sm); padding: var(--space-4); width: 232px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-3); }
.sng-card-title { font-size: 14px; font-weight: 500; line-height: 22px; letter-spacing: -0.35px; color: var(--text-100); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 44px; }
.sng-card-foot { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--line-100); padding-top: var(--space-3); gap: var(--space-2); }
.sng-card-date { white-space: nowrap; font-size: 12px; font-weight: 500; color: var(--text-200); letter-spacing: -0.3px; }
.sng-card-meta { font-size: 11px; color: var(--text-300); margin-top: 2px; }

/* GNB */
.sng-gnb { display: flex; align-items: center; height: var(--header-h); padding: 0 var(--space-6); background: var(--scrim-strong); gap: 36px; }
.sng-gnb-logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; color: var(--text-100); }
.sng-gnb-menu { display: flex; gap: 32px; list-style: none; margin: 0; padding: 0; font-size: 16px; }
.sng-gnb-menu li { color: var(--text-100); }
.sng-gnb-menu li.is-active { color: var(--brand); }
.sng-gnb-util { margin-left: auto; display: flex; gap: 24px; font-size: 14px; color: var(--text-200); }

/* Section header */
.sng-section-head { display: flex; align-items: baseline; justify-content: space-between; padding: var(--space-4); }
.sng-section-title { font-size: 24px; font-weight: 700; margin: 0; color: var(--text-100); }
.sng-more { font-size: 14px; color: var(--text-300); text-decoration: none; }

/* Carousel controls */
.sng-pager { display: inline-flex; align-items: center; gap: var(--space-2); }
.sng-arrow { width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--surface-300); color: var(--text-100); border: 0; font-size: 14px; display: inline-grid; place-items: center; cursor: pointer; }
.sng-count { height: 32px; padding: 0 var(--space-4); border-radius: var(--radius-pill); background: var(--surface-300); display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; color: var(--text-100); }
.sng-count span { color: var(--text-300); font-weight: 400; margin-left: 4px; }

/* ---------- Forms (login / 회원가입 / 비밀번호 찾기) ---------- */
.sng-form { display: flex; flex-direction: column; gap: var(--space-3); width: var(--form-w); max-width: 100%; box-sizing: border-box; }
.sng-form.is-panel { width: var(--form-w-panel); }

/* Text field */
.sng-field { position: relative; }
.sng-input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-sm); background: var(--surface-150); color: var(--text-100); font: 400 15px/22.5px var(--font-sans); caret-color: var(--text-100); }
.is-panel .sng-input { height: var(--field-h); background: var(--surface-300); }
.sng-input::placeholder { color: var(--text-placeholder); }
.sng-input:focus-visible { outline: 2px solid var(--text-250); outline-offset: -2px; }
.sng-field.has-toggle .sng-input { padding-right: 48px; }
.sng-pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: 0; padding: 0; background: none; color: var(--text-400); cursor: pointer; display: grid; place-items: center; }
.sng-tooltip { position: absolute; left: 0; top: calc(100% + 8px); background: var(--tooltip-bg); color: var(--bg-100); font-size: 13px; padding: 8px 14px; border-radius: var(--radius-xs); white-space: nowrap; z-index: 1; }
.sng-tooltip::before { content: ""; position: absolute; left: 16px; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--tooltip-bg); }

/* Round checkbox */
.sng-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-250); cursor: pointer; }
.sng-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sng-check-box { flex: none; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: 1px solid var(--text-400); display: grid; place-items: center; }
.sng-check-box::after { content: ""; width: 7px; height: 4px; border: solid var(--text-400); border-width: 0 0 1.5px 1.5px; transform: translateY(-1px) rotate(-45deg); }
.sng-check input:checked + .sng-check-box { background: var(--brand); border-color: var(--brand); }
.sng-check input:checked + .sng-check-box::after { border-color: var(--on-brand); }
.sng-check input:focus-visible + .sng-check-box { outline: 2px solid var(--text-100); outline-offset: 2px; }

.sng-form-links { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-250); }
.sng-form-links a, .sng-form-links button { color: inherit; background: none; border: 0; padding: 0; font: inherit; text-decoration: none; cursor: pointer; }
.sng-form-links .sep { margin: 0 6px; }

/* Pill CTA */
.sng-cta { width: 100%; height: var(--control-lg); border-radius: var(--radius-cta); border: 0; font: 700 16px/20px var(--font-sans); cursor: pointer; box-sizing: border-box; }
.sng-cta-primary { background: var(--brand); color: var(--on-brand); }
.sng-cta-primary:disabled { background: var(--surface-150); color: var(--text-disabled-cta); cursor: not-allowed; }
.sng-cta-outline { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.sng-cta-ghost { background: transparent; color: var(--text-400); border: 1px solid var(--text-400); }
.sng-cta:focus-visible { outline: 2px solid var(--text-100); outline-offset: 2px; }

/* Stepper */
.sng-steps { display: flex; justify-content: center; gap: 16px; list-style: none; margin: 0; padding: 0; }
.sng-steps li { width: 16px; height: 16px; display: grid; place-items: center; }
.sng-steps li::before { content: ""; border-style: solid; border-width: 5px 0 5px 9px; border-color: transparent transparent transparent var(--brand-step-off); }
.sng-steps li.is-done::before, .sng-steps li.is-current::before { border-left-color: var(--brand); }

/* Page head */
.sng-page-head { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-6); }
.sng-page-title { margin: 0; font-size: 24px; font-weight: 700; line-height: 29px; color: var(--text-150); }
.sng-page-desc { margin: 0; font-size: 16px; line-height: 24px; color: var(--text-250); }
.sng-form-label { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text-200); }
.sng-form-help { margin: 0; font-size: 14px; line-height: 21px; color: var(--text-300); }
.sng-divider { height: 1px; background: var(--surface-150); border: 0; margin: var(--space-6) 0; }

/* Terms agreement */
.sng-terms { display: flex; flex-direction: column; gap: var(--space-2); width: var(--form-w); max-width: 100%; }
.sng-terms-all { display: flex; align-items: center; height: 56px; padding: 0 22px; background: var(--surface-150); border-radius: var(--radius-md); }
.sng-terms-row { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; height: 42px; }
.sng-terms .sng-check { font-size: 14px; gap: 12px; }
.sng-terms .link { font-weight: 700; text-decoration: underline; color: var(--text-250); }
.sng-terms .tag { font-size: 12px; color: var(--text-400); }

/* Auth method button */
.sng-auth-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: var(--auth-btn-h); border: 1px solid var(--surface-150); border-radius: var(--radius-md); background: var(--surface-150); color: var(--text-200); font: 400 16px var(--font-sans); cursor: pointer; }
.sng-auth-btn svg { position: absolute; left: 22px; }
.sng-auth-btn:focus-visible { outline: 2px solid var(--text-100); outline-offset: 2px; }

/* SNS login */
.sng-sns { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.sng-sns-title { font-size: 14px; color: var(--text-250); margin: 0; }
.sng-sns-list { display: flex; gap: 16px; }
.sng-sns-btn { width: var(--sns-btn); height: var(--sns-btn); border-radius: 50%; border: 1px dashed var(--line-300); background: var(--surface-200); color: var(--text-250); font: 500 11px var(--font-sans); cursor: pointer; }

/* Modal */
.sng-modal-backdrop { position: fixed; inset: 0; background: var(--scrim-modal); display: grid; place-items: center; }
.sng-modal { width: var(--modal-w); max-width: calc(100% - 32px); background: var(--surface-200); border-radius: var(--radius-sm); color: var(--text-250); text-align: center; }
.sng-modal-head { padding: 19px 20px; border-bottom: 1px solid var(--line-250); font-size: 16px; }
.sng-modal-body { padding: 10px 20px; min-height: 100px; display: grid; place-items: center; font-size: 16px; line-height: 24px; }
.sng-modal-foot { display: flex; justify-content: center; gap: var(--space-2); padding: 0 20px 19px; }
.sng-modal-btn { width: 180px; height: 40px; border-radius: 28px; border: 1px solid var(--line-300); background: transparent; color: var(--text-250); font: 700 16px var(--font-sans); cursor: pointer; }
.sng-modal-btn.is-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

/* Login panel layout */
.sng-login { display: flex; min-height: 100%; background: var(--bg-100); }
.sng-login-visual { flex: 1; background: var(--surface-100); }
.sng-login-panel { width: var(--login-panel-w); background: var(--scrim-panel); display: flex; align-items: center; justify-content: center; padding: var(--space-12) 0; }
.sng-login-logo { font-weight: 800; font-size: 26px; letter-spacing: -0.5px; color: var(--text-100); text-align: center; margin: 0 0 var(--space-12); }
.sng-topbar { height: var(--top-bar-h); background: var(--bg-000); display: flex; align-items: center; padding: 0 78px; font-weight: 800; font-size: 24px; color: var(--text-100); }

/* ---------- Service menus (일정 / 투어 / 채널 / 프로그램 / 마이페이지 / 고객센터) ---------- */
/* Pill icon button (더보기, 즐겨찾기) */
.sng-pill-btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 14px; border: 1px solid var(--line-100); border-radius: 18px; background: transparent; color: var(--text-300); font: 400 14px var(--font-sans); cursor: pointer; }
.sng-pill-btn.is-icon { width: 32px; padding: 0; justify-content: center; }

/* Category chips */
.sng-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.sng-chip { height: var(--chip-h); padding: 0 24px; border: 1px solid var(--line-400); border-radius: var(--radius-chip); background: transparent; color: var(--text-200); font: 400 16px/16px var(--font-sans); cursor: pointer; }
.sng-chip[aria-pressed="true"] { background: var(--chip-active); border-color: var(--chip-active); color: var(--bg-000); font-weight: 700; }

/* Date strip */
.sng-datestrip { display: flex; align-items: center; justify-content: center; gap: 40px; padding: 12px 0 48px; border-bottom: 1px solid var(--line-200); position: relative; }
.sng-datestrip .d { position: relative; font-size: 20px; font-weight: 700; color: var(--text-100); opacity: .3; background: none; border: 0; cursor: pointer; font-family: inherit; }
.sng-datestrip .d.is-selected { opacity: 1; }
.sng-today { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); width: 72px; height: 28px; box-sizing: border-box; border: 1px solid var(--live); border-radius: 14px; background: var(--scrim-badge); color: var(--live); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.sng-circle-arrow { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--text-300); background: none; color: var(--text-200); cursor: pointer; }

/* Schedule table */
.sng-sched-head { display: flex; align-items: center; gap: var(--space-3); padding: 0 20px; }
.sng-sched-title { font-size: 40px; font-weight: 300; color: var(--text-100); margin: 0 8px 0 0; }
.sng-table { width: 100%; border-collapse: collapse; text-align: center; }
.sng-table th { height: 30px; background: var(--bg-200); border-top: 1px solid var(--surface-100); color: var(--text-300); font-size: 13px; font-weight: 400; }
.sng-table td { height: var(--schedule-row-h); font-size: 13px; color: var(--text-200); }
.sng-table td.time { font-size: 14px; }
.sng-table td.dim { opacity: .3; }
.sng-table td.event { opacity: .6; }
.sng-tag { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; margin: 0 2px; border: 1px solid var(--surface-200); border-radius: var(--radius-tag); font-size: 12px; color: var(--text-300); }
.sng-row-btn { height: 28px; padding: 0 12px; border: 1px solid var(--text-350); background: var(--bg-000); color: var(--text-350); font: 400 13px var(--font-sans); cursor: pointer; }
.sng-row-btn.is-vod { border-color: var(--vod); color: var(--vod); }

/* VOD card */
.sng-vod-row { display: flex; gap: 8px; }
.sng-vod { width: var(--vod-card-w); box-sizing: border-box; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 0 12px; cursor: pointer; }
.sng-vod:hover, .sng-vod.is-hover { border-color: var(--line-hover); }
.sng-vod-thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-300); }
.sng-vod-dur { position: absolute; right: 4px; bottom: 4px; padding: 0 6px; height: 16px; line-height: 16px; background: var(--scrim-badge); color: var(--text-200); font-size: 11px; }
.sng-vod-title { margin: 12px 2px 0; font-size: 16px; line-height: 22px; color: var(--text-100); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sng-vod-date { margin: 8px 2px 0; font-size: 14px; color: var(--text-disabled); }

/* Tour header (투어) */
.sng-tour-head { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 160px; }
.sng-tour-logo { width: var(--tour-logo); height: var(--tour-logo); border-radius: 50%; background: var(--bg-300); display: grid; place-items: center; color: var(--text-300); font-size: 13px; }
.sng-tour-name { font-size: 24px; color: var(--text-100); }

/* Channel timeline */
.sng-hours { display: flex; justify-content: space-between; align-items: center; height: 88px; padding: 0 20px; background: var(--bg-300); }
.sng-hours span { font-size: 20px; font-weight: 700; color: var(--text-100); opacity: .3; }
.sng-hours span.has-live { color: var(--live); opacity: 1; }
.sng-slots { display: flex; height: 55px; box-sizing: border-box; border: 1px solid var(--line-200); border-radius: 27.5px; background: var(--bg-200); overflow: hidden; }
.sng-slots span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--text-250); border-left: 1px solid var(--line-200); }
.sng-slots span:first-child { border-left: 0; }
.sng-slots .dot::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--live); margin-right: 8px; flex: none; }
.sng-program { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 16px; height: 120px; background: var(--bg-300); }
.sng-program.is-now { background: var(--surface-200); }
.sng-program .type { font-size: 12px; font-weight: 700; color: var(--text-400); }
.sng-program .time { font-size: 20px; font-weight: 100; color: var(--text-250); }
.sng-program .title { font-size: 14px; color: var(--text-400); }
.sng-program.is-now .title { color: var(--text-250); }

/* Tabs */
.sng-tabs { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; }
.sng-tabs a { color: var(--text-disabled); text-decoration: none; font-size: 20px; }
.sng-tabs a[aria-current="page"] { color: var(--brand); }
.sng-tabs.is-section { gap: 28px; }
.sng-tabs.is-section a { font-size: 18px; padding-bottom: 6px; }
.sng-tabs.is-section a[aria-current="page"] { color: var(--text-100); border-bottom: 2px solid var(--text-100); }
.sng-tabs.is-filter { gap: 0; align-items: center; }
.sng-tabs.is-filter a { position: relative; display: inline-flex; align-items: center; height: 48px; font-size: 16px; padding: 0 14px; }
.sng-tabs.is-filter li + li a::before { content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 14px; margin-top: -7px; background: var(--line-250); }
.sng-tabs.is-filter a[aria-current="page"] { color: var(--text-100); font-weight: 700; }

/* Page header band */
.sng-band { background: var(--bg-300); border-bottom: 1px solid var(--line-200); padding: 40px 50px; display: flex; align-items: center; gap: 60px; }
.sng-band h1 { margin: 0; font-size: 36px; font-weight: 700; color: var(--text-200); }

/* Board list */
.sng-board-top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line-250); padding-bottom: 28px; }
.sng-search { position: relative; width: 360px; }
.sng-search input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 48px 0 16px; border: 0; border-radius: var(--radius-sm); background: var(--surface-200); color: var(--text-100); font: 14px var(--font-sans); }
.sng-search svg { position: absolute; right: 14px; top: 14px; color: var(--text-400); }
.sng-board-row { display: grid; grid-template-columns: 120px 1fr 120px; align-items: center; height: 61px; border-bottom: 1px solid var(--line-250); font-size: 15px; }
.sng-board-row .cat { color: var(--text-400); text-align: center; }
.sng-board-row .t { color: var(--text-250); }
.sng-board-row .d { color: var(--text-400); text-align: center; }
.sng-board-row .new { color: var(--live); font-size: 12px; font-weight: 700; margin-right: 8px; }

/* User menu */
.sng-usermenu { width: 136px; background: var(--surface-100); border-radius: 0 0 5px 5px; text-align: center; padding-top: 12px; }
.sng-usermenu .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--text-300); margin: 0 auto 8px; }
.sng-usermenu .name { font-size: 20px; color: var(--text-100); padding-bottom: 12px; }
.sng-usermenu ul { list-style: none; margin: 0; padding: 12px 0; border-top: 1px solid var(--line-400); }
.sng-usermenu li { height: 34px; line-height: 34px; font-size: 14px; color: var(--text-250); }

/* Empty state */
.sng-empty { text-align: center; padding: 48px 0; font-size: 14px; color: var(--text-400); }


/* ===== Page layer ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--demo-h) + var(--header-h) + var(--space-4)); }
body { font: var(--type-body); color: var(--text-250); min-width: 320px; word-break: keep-all; overflow-wrap: break-word; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; }
button, input { font-family: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Focus: 2px brand ring everywhere (overrides the bundle's white / grey rings) */
:focus-visible,
.sng-btn:focus-visible, .sng-cta:focus-visible, .sng-auth-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sng-input:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.sng-check input:focus-visible + .sng-check-box { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Small orange buttons: never below 16px/700 */
.sng-btn-primary.sng-btn-sm { font-size: 16px; font-weight: 700; letter-spacing: 0; }

/* DEMO banner: fixed on every screen */
.demo-bar { position: sticky; top: 0; z-index: 100; height: var(--demo-h); display: flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-4); background: var(--tooltip-bg); color: var(--bg-100); font: 700 13px/1.2 var(--font-sans); text-align: center; }
.demo-bar .more { font-weight: 400; }

/* Layout container: 1200px content, centered */
.wrap { width: 100%; max-width: calc(var(--content-w) + var(--gutter) * 2); margin: 0 auto; padding: 0 var(--gutter); }

/* Wordmark (text; replace with the official logo for production) */
.wordmark { display: inline-flex; align-items: center; gap: var(--space-2); text-decoration: none; color: var(--text-100); min-height: 44px; white-space: nowrap; }
.wordmark .wm { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
.wordmark .wm-label { font: 700 12px/1 var(--font-sans); color: var(--text-250); border: 1px solid var(--line-300); border-radius: var(--radius-tag); padding: var(--space-1) var(--space-2); }

/* GNB */
.site-gnb { position: sticky; top: var(--demo-h); z-index: 90; padding: 0; gap: 0; border-bottom: 1px solid var(--line-100); }
.gnb-in { display: flex; align-items: center; gap: 36px; height: 100%; }
.gnb-link { white-space: nowrap; display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text-100); font: var(--type-body); cursor: pointer; text-decoration: none; }
.sng-gnb-menu li.is-active .gnb-link { color: var(--brand); }
.sng-gnb-util { align-items: center; }
.sng-gnb-util .gnb-link { font-size: 14px; color: var(--text-200); }
.gnb-user { color: var(--text-250); font-size: 14px; }
.gnb-m { display: none; margin-left: auto; align-items: center; gap: var(--space-2); }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--text-100); cursor: pointer; }
.icon-btn .bars, .icon-btn .bars::before, .icon-btn .bars::after { display: block; width: 20px; height: 2px; background: var(--text-100); border-radius: var(--radius-xs); position: relative; content: ""; }
.icon-btn .bars::before { position: absolute; top: -6px; }
.icon-btn .bars::after { position: absolute; top: 6px; }
.m-menu { position: absolute; right: var(--space-4); top: 100%; width: 220px; padding-top: var(--space-3); }
.m-menu ul { padding: var(--space-2) 0; }
.m-menu li { height: auto; line-height: inherit; }
.m-menu .gnb-link { width: 100%; justify-content: center; font-size: 15px; color: var(--text-250); }
.m-menu .gnb-link[aria-current="page"] { color: var(--brand); }

/* Logo-only top bar (signup) */
.site-topbar { padding: 0; font-size: inherit; font-weight: inherit; }
.site-topbar .wrap { display: flex; align-items: center; justify-content: space-between; }
.text-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-2); border: 0; background: none; color: var(--text-250); font: 400 14px var(--font-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Generic blocks */
.sec { padding: var(--space-12) 0; }
.sec + .sec { padding-top: 0; }
.sec-head { padding: 0; margin-bottom: var(--space-6); gap: var(--space-3); align-items: center; }
.sec-head .sub { font: 400 14px/21px var(--font-sans); color: var(--text-300); }
.card { background: var(--surface-200); border-radius: var(--radius-sm); padding: var(--space-6); }
.card.is-active { box-shadow: inset 0 0 0 1px var(--brand); }
.meta { font: var(--type-meta); letter-spacing: var(--ls-meta); color: var(--text-300); }
.help { font: var(--type-helper); color: var(--text-300); }
.note { background: var(--surface-200); border: 1px solid var(--line-200); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); font: var(--type-helper); color: var(--text-250); }
.note b { color: var(--text-100); }
.btn-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }

/* Hero */
.hero { background: var(--bg-000); border-bottom: 1px solid var(--line-200); }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-12); align-items: center; padding-top: calc(var(--space-12) * 1.5); padding-bottom: calc(var(--space-12) * 1.5); }
.hero-copy { display: flex; flex-direction: column; gap: var(--space-6); align-items: flex-start; min-width: 0; }
.hero h1 { font: var(--type-headline); letter-spacing: var(--ls-headline); font-size: 44px; line-height: 1.25; color: var(--text-100); }
.hero .lead { font: var(--type-form-label); color: var(--text-250); max-width: 34em; }
.period { display: inline-flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }

/* Key visual: token surfaces and shapes only (no photo) */
.kv { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-md); background: var(--bg-300); overflow: hidden; }
.kv .ring { position: absolute; left: 62%; top: 58%; border-radius: var(--radius-full); border: 1px solid var(--line-200); transform: translate(-50%, -50%); }
.kv .r1 { width: 140%; aspect-ratio: 1; background: var(--bg-200); }
.kv .r2 { width: 100%; aspect-ratio: 1; background: var(--surface-100); }
.kv .r3 { width: 62%; aspect-ratio: 1; background: var(--surface-200); }
.kv .r4 { width: 28%; aspect-ratio: 1; background: var(--surface-300); border-color: var(--line-400); }
.kv .hole { position: absolute; left: 62%; top: 58%; width: 9%; aspect-ratio: 2 / 1; border-radius: var(--radius-full); background: var(--bg-000); transform: translate(-50%, -50%); }
.kv .pole { position: absolute; left: 62%; bottom: 42%; width: 3px; height: 34%; background: var(--text-250); }
.kv .flag { position: absolute; left: calc(62% + 3px); bottom: calc(42% + 34% - 16%); width: 0; height: 0; border-top: solid calc(var(--space-4) + var(--space-1)) transparent; border-bottom: solid calc(var(--space-4) + var(--space-1)) transparent; border-left: solid calc(var(--space-12) - var(--space-2)) var(--chip-active); }
.kv .ball { position: absolute; left: 84%; top: 76%; width: 4%; aspect-ratio: 1; border-radius: var(--radius-full); background: var(--chip-active); }
.kv .num { position: absolute; left: var(--space-6); bottom: var(--space-4); display: flex; align-items: baseline; gap: var(--space-2); color: var(--text-100); }
.kv .num b { font: var(--type-display-numeral); letter-spacing: var(--ls-display-numeral); }
.kv .num span { font: 700 20px/1.2 var(--font-sans); color: var(--text-200); }

/* Status card (logged-in promo) */
.status { display: grid; grid-template-columns: 1fr auto; gap: var(--space-4) var(--space-6); align-items: center; }
.status h2 { font: var(--type-section-title); font-size: 20px; color: var(--text-100); }
.status .msg { color: var(--text-250); font: var(--type-helper); }

/* Progress */
.bar { height: var(--space-3); border-radius: var(--radius-full); background: var(--surface-300); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--text-150); border-radius: var(--radius-full); transition: width .5s ease; }
.status .bar { grid-column: 1 / -1; }

/* How it works */
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); list-style: none; counter-reset: step; }
.how li { display: flex; flex-direction: column; gap: var(--space-2); }
.how .no { font: 700 14px/1 var(--font-sans); color: var(--text-300); letter-spacing: 0.5px; }
.how h3, .prize h3 { font: 700 18px/26px var(--font-sans); letter-spacing: -0.45px; color: var(--text-100); }
.how p { font: var(--type-helper); color: var(--text-300); }

/* Prizes */
.prizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); list-style: none; }
.prize { padding: 0 0 var(--space-4); overflow: hidden; display: flex; flex-direction: column; gap: var(--space-2); }
.prize .thumb { aspect-ratio: 16 / 9; background: var(--bg-300); position: relative; display: grid; place-items: center; margin-bottom: var(--space-2); }
.prize .thumb i { display: block; width: 28%; aspect-ratio: 1; border: 2px solid var(--line-300); border-radius: var(--radius-full); }
.prize:nth-child(2) .thumb i { border-radius: var(--radius-sm); }
.prize:nth-child(3) .thumb i { width: 36%; aspect-ratio: 16 / 9; border-radius: var(--radius-xs); }
.prize:nth-child(4) .thumb i { border-radius: var(--radius-full) var(--radius-full) var(--radius-sm) var(--radius-sm); }
.prize h3, .prize p { padding: 0 var(--space-4); }
.prize .sng-tag { margin: 0; border-color: var(--line-200); }

/* Notice */
.notice { list-style: disc; padding-left: var(--space-6); display: grid; gap: var(--space-2); font: var(--type-helper); color: var(--text-300); }

/* Footer */
.site-foot { background: var(--bg-000); border-top: 1px solid var(--line-100); padding: var(--space-6) 0; font: 400 13px/20px var(--font-sans); color: var(--text-300); }
.site-foot p + p { margin-top: var(--space-1); }

/* Mobile fixed CTA (shown < 768px only) */
.m-cta { display: none; }

/* Demo tools trigger */
.fab { position: fixed; right: var(--space-6); bottom: var(--space-6); z-index: 80; min-height: 44px; padding: 0 var(--space-4); border: 1px solid var(--line-300); border-radius: var(--radius-chip); background: var(--surface-300); color: var(--text-100); font: 700 14px var(--font-sans); cursor: pointer; }

/* Toast */
.toast { position: fixed; left: 50%; top: calc(var(--demo-h) + var(--header-h) + var(--space-3)); z-index: 120; max-width: calc(100% - var(--space-4) * 2); transform: translate(-50%, calc(var(--space-2) * -1)); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--tooltip-bg); color: var(--bg-100); font: 700 14px/20px var(--font-sans); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Modal */
.sng-modal-backdrop { z-index: 110; padding: var(--space-4); overflow-y: auto; grid-template-columns: minmax(0, 1fr); align-items: start; }
.sng-modal { max-width: 100%; justify-self: center; margin: auto 0; }
.sng-modal-head { font-weight: 700; color: var(--text-150); }
.sng-modal-body { padding: var(--space-4) 20px; }
.sng-modal-foot { padding-top: var(--space-2); }
.sng-modal-btn { flex: 1 1 0; max-width: 180px; min-height: 44px; }
.sng-modal.is-wide { width: 480px; text-align: left; }
.sng-modal.is-wide .sng-modal-body { display: block; min-height: 0; }
.sng-modal.is-wide .sng-modal-body > * { width: 100%; }
.tools-grp { padding: var(--space-4) 0; border-top: 1px solid var(--line-250); }
.tools-grp:first-child { border-top: 0; padding-top: var(--space-2); }
.tools-grp h3 { font: 700 15px/22px var(--font-sans); color: var(--text-200); }
.tools-grp .help { margin: var(--space-1) 0 var(--space-3); }
.tools-grp .sng-chips { justify-content: flex-start; gap: var(--space-2); }
.tools-grp .sng-chip { height: 44px; padding: 0 var(--space-4); font-size: 15px; }
.tools-grp .sng-btn { width: 100%; }
.spinner { width: 36px; height: 36px; margin: var(--space-2) auto var(--space-4); border: 3px solid var(--surface-300); border-top-color: var(--text-150); border-radius: var(--radius-full); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .bar > i, .toast { transition: none; } }

/* ===== Forms ===== */
.f-label { display: block; margin-bottom: var(--space-2); font: 700 14px/20px var(--font-sans); color: var(--text-250); }
.f-help { margin-top: var(--space-2); font: var(--type-helper); color: var(--text-300); }
.f-msg { margin-top: var(--space-2); font: var(--type-helper); min-height: 0; }
.f-msg.ok { color: var(--text-250); }
.f-msg.err, .form-err { color: var(--text-100); font-weight: 700; }
.f-msg.err::before, .form-err:not(:empty)::before { content: "!"; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: var(--space-2); border: 1.5px solid var(--text-100); border-radius: var(--radius-full); font-size: 12px; line-height: 1; vertical-align: 1px; }
.form-err:empty { display: none; }
.sng-pwd-toggle { width: 44px; height: 44px; right: var(--space-1); font: 400 13px var(--font-sans); color: var(--text-300); }
.sng-field.has-toggle .sng-input { padding-right: 56px; }
.code-input { text-transform: uppercase; letter-spacing: 1px; }
.or { display: flex; align-items: center; gap: var(--space-3); font: 400 13px var(--font-sans); color: var(--text-300); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-200); }
.sng-form-links { min-height: 44px; flex-wrap: wrap; gap: var(--space-2); }
.sng-form-links .sng-check { min-height: 44px; }
.sng-form-links button { min-height: 44px; }
.sng-form .gap-l { margin-top: var(--space-6); }

/* Login (LoginPanel pattern) */
.login-page { position: relative; min-height: calc(100vh - var(--demo-h)); }
.login-page .sng-login-visual { position: absolute; inset: 0; background: var(--bg-000); overflow: hidden; }
.login-page .kv { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.login-page .kv .ring { left: 30%; top: 55%; }
.login-page .kv .r1 { width: 90%; } .login-page .kv .r2 { width: 64%; } .login-page .kv .r3 { width: 40%; } .login-page .kv .r4 { width: 18%; }
.login-page .kv .hole { left: 30%; top: 55%; width: 5%; }
.login-page .kv .pole { left: 30%; bottom: 45%; height: 26%; }
.login-page .kv .flag { left: calc(30% + 3px); bottom: calc(45% + 26% - 12%); }
.login-page .kv .ball { left: 14%; top: 72%; width: 1.6%; }
.kv-caption { position: absolute; left: var(--gutter); top: var(--space-12); max-width: calc(100% - var(--login-panel-w) - var(--gutter) * 2); display: flex; flex-direction: column; gap: var(--space-3); }
.kv-caption strong { font: var(--type-headline); letter-spacing: var(--ls-headline); color: var(--text-100); }
.kv-caption span { font: var(--type-form-label); color: var(--text-250); }
.kv-foot { position: absolute; left: var(--gutter); bottom: var(--space-6); max-width: calc(100% - var(--login-panel-w) - var(--gutter) * 2); font: 400 12px/18px var(--font-sans); color: var(--text-300); }
.login-page .sng-login-panel { position: relative; margin-left: auto; min-height: calc(100vh - var(--demo-h)); padding: var(--space-12) var(--space-4); }
.login-page .sng-login-logo { display: flex; justify-content: center; margin: 0 0 var(--space-6); }
.login-page .sng-login-logo .wm { font-size: 26px; }
.login-title { font: var(--type-page-title); color: var(--text-150); text-align: center; }
.login-desc { text-align: center; font: var(--type-helper); color: var(--text-250); }
.sng-form.is-panel { max-width: 100%; }
.sng-auth-btn { gap: var(--space-2); font-weight: 700; color: var(--text-100); }
.is-panel .sng-auth-btn { background: var(--surface-300); border-color: var(--surface-300); }
.is-panel .note { background: transparent; }

/* Signup (top bar + 392px column) */
.form-page { padding: var(--space-12) var(--space-4) calc(var(--space-12) * 2); display: flex; justify-content: center; }
.form-page .sng-form { gap: var(--space-4); }
.form-page .sng-page-head { margin-bottom: var(--space-6); gap: var(--space-4); }
.form-page .sng-steps { margin: 0; }
.sng-terms-all { min-height: 56px; height: auto; }
.sng-terms-row { min-height: 44px; height: auto; gap: var(--space-2); }
.sng-terms .sng-check { min-height: 44px; }
.sng-terms-all .sng-check { font-weight: 700; color: var(--text-200); font-size: 15px; }
.sng-terms .link { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
.sng-terms .tag { white-space: nowrap; }
.done-mark { width: 64px; height: 64px; margin: 0 auto; }
.done-mark .sng-check-box { width: 64px; height: 64px; background: var(--brand); border-color: var(--brand); }
.done-mark .sng-check-box::after { width: 24px; height: 12px; border-width: 0 0 3px 3px; border-color: var(--on-brand); transform: translateY(-3px) rotate(-45deg); }

/* My (PageBand + 1200 column) */
.my-band { padding: 0; display: block; }
.my-band .wrap { display: flex; align-items: center; gap: var(--space-6); padding-top: calc(var(--space-12) - var(--space-2)); padding-bottom: calc(var(--space-12) - var(--space-2)); }
.avatar { flex: none; width: 52px; height: 52px; border-radius: var(--radius-full); background: var(--text-300); color: var(--bg-100); display: grid; place-items: center; font: 700 20px var(--font-sans); }
.avatar.sm { width: 36px; height: 36px; font-size: 15px; }
.band-name { font: 700 24px/32px var(--font-sans); color: var(--text-100); }
.band-name small { font: 400 20px var(--font-sans); color: var(--text-400); margin-left: var(--space-1); }
.band-status { font: 400 18px/26px var(--font-sans); color: var(--text-200); margin-top: var(--space-1); overflow-wrap: anywhere; }
.band-status b { letter-spacing: 1px; }
.my-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.my-grid .card { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.card-h h2 { font: 700 20px/28px var(--font-sans); color: var(--text-100); }
.code-big { font: 700 36px/1.1 var(--font-sans); letter-spacing: 3px; color: var(--text-100); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.link-line { font: 400 13px/20px var(--font-sans); color: var(--text-300); overflow-wrap: anywhere; }
.my-grid .btn-row .sng-btn { flex: 1 1 140px; }
.count { display: flex; align-items: baseline; gap: var(--space-2); color: var(--text-100); }
.count b { font: 700 48px/1 var(--font-sans); letter-spacing: -1px; }
.count span { font: 400 18px var(--font-sans); color: var(--text-300); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-2); list-style: none; }
.slots li { min-height: 56px; border-radius: var(--radius-sm); border: 1px dashed var(--line-300); display: flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-2); font: 400 14px var(--font-sans); color: var(--text-300); }
.slots li.on { border: 1px solid var(--surface-300); background: var(--surface-300); color: var(--text-100); font-weight: 700; }
.slots li.on .sng-check-box, .entered .sng-check-box { background: var(--brand); border-color: var(--brand); }
.slots li.on .sng-check-box::after, .entered .sng-check-box::after { border-color: var(--on-brand); }
.entered { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--surface-150); color: var(--text-100); font: 700 15px/22px var(--font-sans); }
.entered .sng-check-box { width: 24px; height: 24px; }
.entered .sng-check-box::after { width: 10px; height: 5px; border-width: 0 0 2px 2px; }
.entered small { display: block; font: 400 13px/18px var(--font-sans); color: var(--text-300); }
.st-tag { display: inline-flex; align-items: center; height: 28px; padding: 0 var(--space-2); border: 1px solid var(--line-300); border-radius: var(--radius-tag); font: 700 13px var(--font-sans); color: var(--text-250); white-space: nowrap; }
.st-tag.is-on { border-color: var(--brand); color: var(--brand); }

/* Friend list (BoardList rows) */
.board { list-style: none; border-top: 1px solid var(--line-250); }
.board .sng-board-row { grid-template-columns: 80px 1fr 220px 120px; min-height: 61px; height: auto; gap: var(--space-2); }
.board .sng-board-row .cat { font: 400 14px var(--font-sans); }
.board .sng-board-row .t { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.board .sng-board-row .d { color: var(--text-300); font: var(--type-meta); letter-spacing: var(--ls-meta); }
.board .sng-board-row .s { text-align: center; }
.sng-empty { border-top: 1px solid var(--line-250); border-bottom: 1px solid var(--line-250); }
.demo-hint { margin-top: var(--space-6); text-align: center; font: 400 13px/20px var(--font-sans); color: var(--text-300); }

/* Invite landing */
.invite { text-align: center; }
.invite .hero-in { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: var(--space-6); }
.invite .hero-copy { align-items: center; }
.invite .lead { margin: 0 auto; }
.from { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-4) var(--space-1) var(--space-1); border-radius: var(--radius-full); background: var(--surface-200); color: var(--text-200); font: 400 15px var(--font-sans); }
.code-card { width: var(--form-w); max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-2); text-align: center; }

/* ===== Responsive ===== */
/* Small desktop 1024–1279: tighter GNB */
@media (max-width: 1279px) {
  :root { --gutter: var(--space-12); }
  .gnb-in { gap: var(--space-6); }
  .sng-gnb-menu { gap: var(--space-6); }
}
/* Tablet 768–1023 */
@media (max-width: 1023px) {
  :root { --gutter: var(--space-12); }
  .site-gnb nav, .sng-gnb-util { display: none; }
  .gnb-m { display: flex; }
  .gnb-m .gnb-link { white-space: nowrap; flex: none; padding: 0 var(--space-2); font-size: 15px; }
  .hero-in { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-6); padding-top: var(--space-12); padding-bottom: var(--space-12); }
  .hero h1 { font-size: 32px; }
  .prizes { grid-template-columns: repeat(2, 1fr); }
  .prize .thumb { aspect-ratio: 21 / 9; }
  .login-page .sng-login-panel { width: min(var(--login-panel-w), 62%); }
  .kv-caption, .kv-foot { max-width: calc(38% - var(--gutter) - var(--space-4)); }
  .kv-caption strong { font-size: 28px; line-height: 1.25; }
  .board .sng-board-row { grid-template-columns: 56px 1fr 180px 96px; }
}
/* Mobile < 768 */
@media (max-width: 767px) {
  :root { --gutter: var(--space-4); --header-h: 56px; }
  .demo-bar .more { display: none; }
  .wordmark .wm { font-size: 17px; }
  .gnb-in { gap: var(--space-2); }
  .kv { aspect-ratio: 16 / 9; }
  .kv .num b { font-size: 72px; }
  .prize { display: grid; grid-template-columns: 112px 1fr; grid-template-rows: auto auto; align-items: center; gap: var(--space-1) var(--space-4); padding: var(--space-3); }
  .prize .thumb { grid-row: 1 / span 2; margin: 0; border-radius: var(--radius-xs); }
  .prize h3, .prize p { padding: 0; }
  .prize h3 { align-self: end; font-size: 16px; line-height: 22px; }
  .prize p { align-self: start; }
  .gnb-m { display: flex; }
  .gnb-m .gnb-link { padding: 0 var(--space-2); font-size: 15px; }
  .hero-in { grid-template-columns: minmax(0, 1fr); padding-top: var(--space-6); padding-bottom: var(--space-6); }
  .hero h1 { font-size: 28px; line-height: 1.3; letter-spacing: -0.6px; }
  .hero .hero-cta { display: none; }
  .sec { padding: calc(var(--space-12) - var(--space-4)) 0; }
  .sec-head .sng-section-title { font-size: 20px; }
  .card { padding: var(--space-4); }
  .status { grid-template-columns: 1fr; }
  .status .sng-btn { width: 100%; }
  .how, .prizes, .my-grid { grid-template-columns: 1fr; }
  .m-cta { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 85; padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom)); background: var(--bg-100); border-top: 1px solid var(--line-200); }
  .m-cta .sng-btn { width: 100%; }
  body { padding-bottom: calc(44px + var(--space-6)); }
  body.has-mcta { padding-bottom: calc(var(--m-cta-h) + env(safe-area-inset-bottom)); }
  .fab { right: var(--space-4); bottom: var(--space-4); }
  body.has-mcta .fab { bottom: calc(var(--m-cta-h) + var(--space-3) + env(safe-area-inset-bottom)); }
  .login-page .sng-login-visual { display: none; }
  .login-page .sng-login-panel { width: 100%; background: var(--bg-100); padding: var(--space-6) var(--space-4) calc(var(--space-12) + var(--space-12)); align-items: flex-start; min-height: 0; }
  .site-topbar { height: var(--header-h); }
  .form-page { padding-top: var(--space-6); }
  .my-band .wrap { gap: var(--space-4); padding-top: var(--space-6); padding-bottom: var(--space-6); }
  .band-name { font-size: 20px; line-height: 28px; }
  .band-name small { font-size: 16px; }
  .band-status { font-size: 15px; line-height: 22px; }
  .code-big { font-size: 30px; }
  .board .sng-board-row { grid-template-columns: 28px 1fr auto; padding: var(--space-3) 0; }
  .board .sng-board-row .d { grid-column: 2; grid-row: 2; text-align: left; padding-left: calc(36px + var(--space-3)); }
  .board .sng-board-row .s { grid-column: 3; grid-row: 1 / span 2; }
  .sng-modal-foot { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="demo-bar" role="note">기획 검토용 DEMO · 실제 서비스가 아님<span class="more"> · 입력값은 이 브라우저에만 저장됩니다</span></div>
<div id="view"></div>
<button type="button" class="fab" id="fab" onclick="openTools()" aria-haspopup="dialog">데모 도구</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
/* =========================================================
   Mock DB (localStorage only - nothing is sent anywhere)
   Production: replace with the member / invite API.
   ========================================================= */
const KEY = 'golfInviteDemo.v1';
const DEFAULT = { users: [], session: null, goal: 3, loginMode: 'both', eventEnd: '2026-12-31', savedEmail: '' };
let db = load();
function load(){ try { const r = JSON.parse(localStorage.getItem(KEY)); return r ? { ...DEFAULT, ...r } : structuredClone(DEFAULT); } catch (e) { return structuredClone(DEFAULT); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

const me = () => db.users.find(u => u.id === db.session) || null;
const byCode = c => db.users.find(u => u.code && u.code === (c || '').trim().toUpperCase()) || null;
const invitees = u => db.users.filter(x => x.referredBy && x.referredBy === u.code).sort((a, b) => a.createdAt - b.createdAt);
const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'h' + h; }; // demo only, not security
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Names are masked after the first character (UserMenu rule): 홍** */
const maskName = n => { n = String(n || ''); return n.length <= 1 ? n : n[0] + '*'.repeat(n.length - 1); };
const DOW = '일월화수목금토';
const pad = n => String(n).padStart(2, '0');
const fmtDay = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}(${DOW[d.getDay()]})`;
const fmt = t => { const d = new Date(t); return `${fmtDay(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const endLabel = () => { const [y, m, d] = db.eventEnd.split('-').map(Number); return fmtDay(new Date(y, m - 1, d)); };
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function genCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c; do { c = 'GN' + Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (byCode(c));
  return c;
}

/* Sign-up: +1 for the referrer, auto entry when the goal is reached */
function createUser({ name, email, pw, phone, ref, via = 'web', marketing = false }){
  const referrer = ref ? byCode(ref) : null;
  const u = { id: 'u' + Date.now() + Math.random().toString(36).slice(2, 6), name, email, pw: pw ? hash(pw) : null, phone,
              code: null, referredBy: referrer ? referrer.code : null, via, marketing, createdAt: Date.now(), entered: false, enteredAt: null };
  db.users.push(u);
  if (referrer) checkEntry(referrer);
  save();
  return u;
}
function checkEntry(u){
  if (!u.entered && invitees(u).length >= db.goal){ u.entered = true; u.enteredAt = Date.now(); return true; }
  return false;
}
/* Invite code: issued once, the first time a logged-in user opens 마이 */
function ensureCode(u){ if (!u.code){ u.code = genCode(); save(); } return u.code; }

/* =========================================================
   Router (hash)
   ========================================================= */
function parse(){
  const h = location.hash.slice(1) || '/';
  const [path, q] = h.split('?');
  return { path, q: Object.fromEntries(new URLSearchParams(q || '')) };
}
function go(p){ if (location.hash.slice(1) === p) render(); else location.hash = p; }
window.addEventListener('hashchange', () => { if (parse().path === '/signup') su = null; render(); });

const routes = { '/': Promo, '/login': Login, '/signup': Signup, '/my': My };
let pendingScroll = null;
function render(){
  const { path, q } = parse();
  if (path === '/my' && !me()) return go('/login?next=/my');
  let fn = routes[path];
  if (path.startsWith('/i/')) fn = () => InviteLanding(decodeURIComponent(path.slice(3)));
  if (!fn) fn = Promo;
  const out = fn(q);
  document.getElementById('view').innerHTML = out.html;
  document.body.classList.toggle('has-mcta', !!out.mcta);
  window.scrollTo(0, 0);
  out.after?.();
  if (pendingScroll){ const el = document.getElementById(pendingScroll); pendingScroll = null; el?.scrollIntoView(); }
}

/* ---------- Shared chrome ---------- */
const wordmark = (tag = 'a', cls = '') => `<${tag} class="wordmark ${cls}" ${tag === 'a' ? 'href="#/"' : ''} aria-label="SPOTV NOW Golf 친구초대 홈"><span class="wm">SPOTV NOW Golf</span><span class="wm-label">친구초대</span></${tag}>`;

function gnb(active){
  const u = me();
  const items = [['/', 'intro', '이벤트 안내'], ['/', 'how', '참여 방법'], ['/', 'prizes', '경품'], ['/', 'notice', '유의사항'], ['/my', '', '내 초대 현황']];
  const menu = items.map(([p, sec, l]) => {
    const on = (active === 'my' && p === '/my') || (active === 'promo' && sec === 'intro');
    return `<li class="${on ? 'is-active' : ''}"><a class="gnb-link" href="#${p === '/my' ? '/my' : '/'}" ${sec ? `onclick="return toSec('${sec}')"` : ''} ${on ? 'aria-current="page"' : ''}>${l}</a></li>`;
  }).join('');
  const util = u
    ? `<span class="gnb-user">${esc(maskName(u.name))} 님</span><button type="button" class="gnb-link" onclick="logout()">로그아웃</button>`
    : `<a class="gnb-link" href="#/login">로그인</a><a class="gnb-link" href="#/signup">회원가입</a>`;
  const mItems = [
    ...items.map(([p, sec, l]) => `<li><a class="gnb-link" href="#${p}" ${sec ? `onclick="closeMenu();return toSec('${sec}')"` : 'onclick="closeMenu()"'} ${active === 'my' && p === '/my' ? 'aria-current="page"' : ''}>${l}</a></li>`),
    u ? `<li><button type="button" class="gnb-link" onclick="closeMenu();logout()">로그아웃</button></li>` : `<li><a class="gnb-link" href="#/signup" onclick="closeMenu()">회원가입</a></li>`
  ].join('');
  return `
  <header class="sng-gnb site-gnb">
    <div class="wrap gnb-in">
      ${wordmark()}
      <nav aria-label="이벤트 메뉴"><ul class="sng-gnb-menu">${menu}</ul></nav>
      <div class="sng-gnb-util">${util}</div>
      <div class="gnb-m">
        ${u ? '' : '<a class="gnb-link" href="#/login">로그인</a>'}
        <button type="button" class="icon-btn" id="menuBtn" aria-expanded="false" aria-controls="mMenu" onclick="toggleMenu()"><span class="bars" aria-hidden="true"></span><span class="sr-only">메뉴</span></button>
      </div>
    </div>
    <div class="m-menu" id="mMenu" hidden>
      <div class="sng-usermenu" style="width:auto">
        ${u ? `<div class="avatar" style="margin:0 auto var(--space-2)">${esc(u.name[0])}</div><div class="name">${esc(maskName(u.name))}</div>` : ''}
        <ul>${mItems}</ul>
      </div>
    </div>
  </header>`;
}
function toggleMenu(force){
  const m = document.getElementById('mMenu'), b = document.getElementById('menuBtn');
  if (!m) return;
  const open = force ?? m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', String(open));
}
function closeMenu(){ toggleMenu(false); }
function toSec(id){
  if (parse().path !== '/'){ pendingScroll = id; go('/'); }
  else document.getElementById(id)?.scrollIntoView();
  return false;
}
const footer = () => `
  <footer class="site-foot"><div class="wrap">
    <p>기획 검토용 데모 페이지입니다. 실제 SPOTV NOW Golf 서비스가 아니며, 입력값은 이 브라우저(localStorage)에만 저장되고 외부로 전송되지 않습니다.</p>
    <p>로고는 텍스트 워드마크로 대체했습니다. 경품·기간은 예시입니다.</p>
  </div></footer>`;

function logout(){ db.session = null; save(); toast('로그아웃되었습니다.'); go('/'); }

/* =========================================================
   Screen 1. Promo (#/) - logged-in / logged-out
   ========================================================= */
function Promo(){
  const u = me(); const goal = db.goal;
  const cnt = u ? invitees(u).length : 0;
  const ctaLabel = u && u.code ? '현황 보기' : '초대코드 만들기';
  const ctaGo = u ? `go('/my')` : `go('/login?next=/my')`;
  const status = u ? `
  <section class="sec" aria-labelledby="stTitle"><div class="wrap">
    <div class="card status ${u.entered ? 'is-active' : ''}">
      <div>
        <h2 id="stTitle">${esc(maskName(u.name))} 님의 초대 현황</h2>
        <p class="msg">${u.entered ? `${fmt(u.enteredAt)}에 자동 응모되었습니다. 당첨 발표를 기다려 주세요.` : `친구 ${goal - cnt}명이 더 가입하면 자동으로 응모됩니다.`}</p>
      </div>
      <div class="btn-row" style="align-items:center">
        <span class="st-tag ${u.entered ? 'is-on' : ''}">${u.entered ? '응모 완료' : `${cnt} / ${goal}명`}</span>
        <button type="button" class="sng-btn sng-btn-secondary sng-btn-lg" onclick="go('/my')">현황 보기</button>
      </div>
      <div class="bar" role="progressbar" aria-label="초대 진행률" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.min(cnt, goal)}"><i style="width:${Math.min(100, cnt / goal * 100)}%"></i></div>
    </div>
  </div></section>` : '';

  const html = `
  ${gnb('promo')}
  <main>
    <section class="hero" id="intro" aria-labelledby="heroTitle"><div class="wrap hero-in">
      <div class="hero-copy">
        <p class="period"><span class="sng-tag">이벤트 기간(예시)</span><span class="meta">~ ${endLabel()}</span></p>
        <h1 id="heroTitle">친구 ${goal}명이 가입하면<br>경품 이벤트에 자동 응모</h1>
        <p class="lead">내 초대코드로 친구가 SPOTV NOW Golf에 가입하면 초대 인원이 바로 올라갑니다. ${goal}명을 채우면 따로 신청하지 않아도 응모됩니다.</p>
        <div class="btn-row hero-cta">
          <button type="button" class="sng-btn sng-btn-primary sng-btn-lg" onclick="${ctaGo}">${ctaLabel}</button>
          <button type="button" class="sng-btn sng-btn-secondary sng-btn-lg" onclick="toSec('how')">참여 방법</button>
        </div>
      </div>
      <div class="kv" aria-hidden="true">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span>
        <span class="hole"></span><span class="pole"></span><span class="flag"></span><span class="ball"></span>
        <div class="num"><b>${goal}</b><span>명 가입 시 응모</span></div>
      </div>
    </div></section>

    ${status}

    <section class="sec" id="how" aria-labelledby="howTitle"><div class="wrap">
      <div class="sng-section-head sec-head"><h2 class="sng-section-title" id="howTitle">참여 방법</h2></div>
      <ol class="how">
        <li class="card"><span class="no">STEP 1</span><h3>초대코드 받기</h3><p>SPOTV NOW Golf 계정으로 로그인하면 나만의 초대코드가 발급됩니다.</p></li>
        <li class="card"><span class="no">STEP 2</span><h3>친구에게 공유</h3><p>초대 링크를 메신저나 문자로 보내거나 초대코드를 알려 주세요.</p></li>
        <li class="card"><span class="no">STEP 3</span><h3>${goal}명 가입 시 자동 응모</h3><p>친구가 초대코드로 회원 가입을 마치면 1명씩 올라가고, ${goal}명이 되면 자동으로 응모됩니다.</p></li>
      </ol>
    </div></section>

    <section class="sec" id="prizes" aria-labelledby="przTitle"><div class="wrap">
      <div class="sng-section-head sec-head" style="justify-content:flex-start"><h2 class="sng-section-title" id="przTitle">경품</h2><span class="sub">예시 · 확정 전</span></div>
      <ul class="prizes">
        ${[['라운드 이용권', '추첨 O명'], ['골프 용품', '추첨 O명'], ['SPOTV NOW Golf 이용권 1개월', '추첨 O명'], ['커피 쿠폰', '추첨 O명']].map(([t, m]) => `
        <li class="card prize"><div class="thumb" aria-hidden="true"><i></i></div><h3>${t}</h3><p class="meta"><span class="sng-tag">예시</span> ${m}</p></li>`).join('')}
      </ul>
    </div></section>

    <section class="sec" id="notice" aria-labelledby="ntTitle"><div class="wrap">

      <div class="kv-caption"><strong>친구초대 이벤트</strong><span>친구 ${db.goal}명이 가입하면 경품 이벤트에 자동 응모됩니다.</span></div>

    <div class="sng-login-panel">
      <div class="sng-form is-panel">
        <div class="sng-login-logo">${wordmark()}</div>
        <h1 class="login-title">로그인</h1>
        <p class="login-desc">로그인하면 나만의 초대코드가 발급됩니다.</p>
        <p class="note"><b>[기획 검토]</b> 로그인 방식은 확정 전입니다. 데모 도구에서 앱 로그인, 웹 로그인, 둘 다를 바꿔 비교해 주세요. 현재: <b>${modeName}</b></p>
        ${mode !== 'web' ? appBlock : ''}
        ${mode === 'both' ? '<p class="or">또는 웹에서 로그인</p>' : ''}

function loginValid(f){
  const ok = f.email.value.trim() && f.pw.value;
  document.getElementById('lgSubmit').disabled = !ok;
}
function togglePw(btn){
  const i = document.getElementById(btn.getAttribute('aria-controls'));
  const show = i.type === 'password'; i.type = show ? 'text' : 'password';
  btn.textContent = show ? '숨기기' : '보기'; btn.setAttribute('aria-pressed', String(show));
}
function notInDemo(){ alertModal('알림', '데모에서는 제공하지 않는 기능입니다.'); }
function webLogin(e, next){
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim().toLowerCase();
  const u = db.users.find(x => x.email === email);
  if (!u || u.pw !== hash(f.pw.value)){
    document.getElementById('lgErr').textContent = '이메일 또는 비밀번호가 일치하지 않습니다. 데모에서는 먼저 회원 가입을 해 주세요.';
    return false;
  }
  db.savedEmail = f.saveEmail.checked ? email : '';
  db.session = u.id; save(); toast(`${maskName(u.name)} 님, 환영합니다.`); go(next); return false;
}
function appLogin(next){

  setTimeout(() => {
    if (!document.getElementById('appAuth')) return;
    let u = db.users.find(x => x.via === 'app-demo');

/* =========================================================
   Screen 3. Signup (top bar + 392px column, 3 steps)
   ========================================================= */
let su = null; // { step, terms:{tos,privacy,mkt}, data:{}, ref, next, result }
const TERMS = [['tos', '이용약관', true], ['privacy', '개인정보 수집·이용', true], ['mkt', '이벤트·마케팅 정보 수신', false]];
function stepper(n){
  const names = ['약관 동의', '정보 입력', '가입 완료'];
  return `<ol class="sng-steps">${names.map((t, i) => `<li class="${i + 1 < n ? 'is-done' : i + 1 === n ? 'is-current' : ''}" aria-label="${i + 1}단계 ${t}${i + 1 < n ? ' 완료' : ''}" ${i + 1 === n ? 'aria-current="step"' : ''}></li>`).join('')}</ol>`;
}
function Signup(q){
  const ref = (q.ref || '').toUpperCase();
  if (!su) su = { step: 1, terms: { tos: false, privacy: false, mkt: false }, data: { ref }, next: q.next || '/my', result: null };
  const html = `
  <header class="sng-topbar site-topbar"><div class="wrap">${wordmark()}<a class="text-link" href="#/login">로그인</a></div></header>
  <main class="form-page"><div class="sng-form" id="suCol">${signupStep()}</div></main>`;
  return { html, after: signupAfter };
}
function rerenderSignup(){ document.getElementById('suCol').innerHTML = signupStep(); window.scrollTo(0, 0); signupAfter(); document.querySelector('#suCol h1')?.focus(); }
function signupAfter(){ if (su.step === 1) termsSync(); if (su.step === 2){ const f = document.getElementById('suForm'); checkRef(f.ref); signupValid(f); } }
function signupStep(){
  const refUser = byCode(su.data.ref);
  const invited = refUser ? `<p class="note"><b>${esc(maskName(refUser.name))}</b> 님의 초대로 가입합니다. 초대코드 <b>${esc(refUser.code)}</b></p>` : '';
  if (su.step === 1) return `
    <div class="sng-page-head"><h1 class="sng-page-title" tabindex="-1">회원 가입</h1>${stepper(1)}<p class="sng-page-desc">서비스 이용을 위해 이용약관에 동의해 주세요.</p></div>
    ${invited}
    <div class="sng-terms" role="group" aria-label="약관 동의">
      <div class="sng-terms-all"><label class="sng-check"><input type="checkbox" id="tAll" onchange="termsAll(this.checked)"><span class="sng-check-box"></span>전체동의</label></div>
      ${TERMS.map(([k, t, req]) => `
      <div class="sng-terms-row">
        <label class="sng-check"><input type="checkbox" data-term="${k}" ${su.terms[k] ? 'checked' : ''} onchange="termOne('${k}',this.checked)"><span class="sng-check-box"></span><span><button type="button" class="link" onclick="termText('${t}')">${t}</button> 동의</span></label>
        <span class="tag">${req ? '(필수)' : '(선택)'}</span>
      </div>`).join('')}
    </div>
    <button type="button" class="sng-cta sng-cta-primary gap-l" id="tNext" onclick="su.step=2;rerenderSignup()" disabled>다음</button>`;
  if (su.step === 2){ const d = su.data; return `
    <div class="sng-page-head"><h1 class="sng-page-title" tabindex="-1">회원 가입</h1>${stepper(2)}<p class="sng-page-desc">가입 정보를 입력해 주세요.</p></div>
    ${invited}
    <form id="suForm" class="sng-form" style="width:100%" onsubmit="return doSignup(event)" oninput="signupValid(this)" novalidate>
      <div><label class="f-label" for="suName">이름</label><div class="sng-field"><input class="sng-input" id="suName" name="name" maxlength="20" autocomplete="off" placeholder="홍길동" value="${esc(d.name)}"></div></div>
      <div><label class="f-label" for="suEmail">이메일(아이디)</label><div class="sng-field"><input class="sng-input" id="suEmail" name="email" type="email" autocomplete="off" placeholder="golf@example.com" value="${esc(d.email)}"></div></div>
      <div><label class="f-label" for="suPw">비밀번호</label>
        <div class="sng-field has-toggle"><input class="sng-input" id="suPw" name="pw" type="password" autocomplete="new-password" aria-describedby="suPwHelp">
          <button type="button" class="sng-pwd-toggle" aria-controls="suPw" aria-pressed="false" onclick="togglePw(this)">보기</button></div>
        <p class="f-help" id="suPwHelp">4자 이상 입력해 주세요. 데모 전용이므로 실제 비밀번호 사용 금지.</p></div>
      <div><label class="f-label" for="suPhone">휴대폰 번호</label><div class="sng-field"><input class="sng-input" id="suPhone" name="phone" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000" aria-describedby="suPhoneHelp" value="${esc(d.phone)}"></div>
        <p class="f-help" id="suPhoneHelp">실서비스에서는 본인인증으로 중복 가입을 막습니다.</p></div>
      <div><label class="f-label" for="suRef">초대코드(선택)</label><div class="sng-field"><input class="sng-input code-input" id="suRef" name="ref" autocomplete="off" placeholder="GNXXXXXX" maxlength="12" aria-describedby="refHint" value="${esc(d.ref)}" oninput="checkRef(this)"></div>
        <p class="f-msg" id="refHint" aria-live="polite"></p></div>
      <p class="form-err" id="suErr" role="alert"></p>
      <button class="sng-cta sng-cta-primary gap-l" type="submit" id="suSubmit" disabled>가입하기</button>
      <button class="sng-cta sng-cta-ghost" type="button" onclick="keepSignup();su.step=1;rerenderSignup()">이전</button>
    </form>`; }
  const r = su.result || {};
  return `
    <div class="sng-page-head"><h1 class="sng-page-title" tabindex="-1">회원 가입</h1>${stepper(3)}<p class="sng-page-desc">회원 가입이 완료되었습니다.</p></div>
    <div class="done-mark" aria-hidden="true"><span class="sng-check-box"></span></div>
    ${r.referrer ? `<p class="note" style="text-align:center"><b>${esc(maskName(r.referrer))}</b> 님의 초대 인원에 반영되었습니다.</p>` : ''}
    <button type="button" class="sng-cta sng-cta-primary gap-l" onclick="su=null;go('${esc(su.next)}')">확인</button>`;
}
function termsSync(){
  const all = TERMS.every(([k]) => su.terms[k]);
  const req = TERMS.every(([k, , r]) => !r || su.terms[k]);
  document.getElementById('tAll').checked = all;
  document.getElementById('tNext').disabled = !req;
}
function termsAll(on){ TERMS.forEach(([k]) => su.terms[k] = on); document.querySelectorAll('[data-term]').forEach(i => i.checked = on); termsSync(); }
function termOne(k, on){ su.terms[k] = on; termsSync(); }
function termText(t){ alertModal(t, `${t} 전문은 실서비스에서 연결됩니다.`); }
function keepSignup(){ const f = document.getElementById('suForm'); if (!f) return; su.data = { name: f.name.value, email: f.email.value, phone: f.phone.value, ref: f.ref.value }; }
function checkRef(el){
  const v = el.value.trim().toUpperCase(); const h = document.getElementById('refHint');
  h.className = 'f-msg';
  if (!v){ h.textContent = ''; return; }
  const r = byCode(v);
  if (r){ h.classList.add('ok'); h.textContent = `확인되었습니다. ${maskName(r.name)} 님의 초대코드입니다.`; }
  else { h.classList.add('err'); h.textContent = '존재하지 않는 초대코드입니다. 다시 확인해 주세요.'; }
  signupValid(el.form);
}
function signupValid(f){
  const ref = f.ref.value.trim();
  const ok = f.name.value.trim() && EMAIL_RE.test(f.email.value.trim()) && f.pw.value.length >= 4 &&
             f.phone.value.replace(/\D/g, '').length >= 10 && (!ref || byCode(ref));
  document.getElementById('suSubmit').disabled = !ok;
}
function doSignup(e){
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim().toLowerCase();
  const phone = f.phone.value.replace(/\D/g, '');
  const ref = f.ref.value.trim().toUpperCase();
  const err = m => { document.getElementById('suErr').textContent = m; return false; };
  if (db.users.some(u => u.email === email)) return err('이미 가입된 이메일입니다. 다른 이메일을 입력해 주세요.');
  if (phone && db.users.some(u => u.phone === phone)) return err('이미 가입된 휴대폰 번호입니다. 중복 가입은 할 수 없습니다.');
  if (ref && !byCode(ref)) return err('존재하지 않는 초대코드입니다.');
  const referrer = ref ? byCode(ref) : null;
  const wasEntered = referrer?.entered;
  const u = createUser({ name: f.name.value.trim(), email, pw: f.pw.value, phone, ref, marketing: su.terms.mkt });
  db.session = u.id; save();
  su.result = { referrer: referrer?.name };
  su.step = 3; rerenderSignup();
  toast(referrer ? `가입되었습니다. ${maskName(referrer.name)} 님의 초대 인원이 1명 늘었습니다.` : '가입되었습니다.');
  if (referrer && !wasEntered && referrer.entered) setTimeout(() => toast(`${maskName(referrer.name)} 님이 목표 인원을 채워 자동 응모되었습니다.`), 2200);
  return false;
}

function copy(t, msg){ (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast(msg), () => toast(t)); }
function share(link){

}

   ========================================================= */
function InviteLanding(code){

  <main class="invite"><section class="hero"><div class="wrap hero-in"><div class="hero-copy">
    <h1>유효하지 않은 초대 링크입니다</h1>

      </div>

    </div></section>
    <section class="sec"><div class="wrap">
      <div class="sng-section-head sec-head"><h2 class="sng-section-title">이벤트 안내</h2></div>
      <ol class="how">
        <li class="card"><span class="no">STEP 1</span><h3>초대코드로 가입</h3><p>위 초대코드가 입력된 상태로 회원 가입을 진행해 주세요.</p></li>
        <li class="card"><span class="no">STEP 2</span><h3>친구 인원 반영</h3><p>가입을 마치면 초대한 친구의 초대 인원이 1명 늘어납니다.</p></li>
        <li class="card"><span class="no">STEP 3</span><h3>나도 참여</h3><p>가입 후 내 초대코드를 받아 친구를 초대할 수 있습니다.</p></li>

  </main>
  ${footer()}
  <div class="m-cta"><button type="button" class="sng-btn sng-btn-primary sng-btn-lg" onclick="${ctaAction}">가입하기</button></div>`;

/* =========================================================
   Demo tools
   ========================================================= */
const FAKE = ['김민준', '이서연', '박도윤', '최하은', '정시우', '강지유', '조예준', '윤서아', '장하준', '임지아'];
function simulateFriend(){
  const u = me();
  if (!u){ toast('먼저 로그인해 주세요.'); return; }
  ensureCode(u);
  const wasEntered = u.entered;
  const n = FAKE[db.users.length % FAKE.length];
  createUser({ name: n, email: `friend${Date.now()}${Math.random().toString(36).slice(2, 5)}@demo`, pw: 'demo', phone: '010' + String(Math.floor(Math.random() * 1e8)).padStart(8, '0'), ref: u.code });
  closeModal();
  toast(`${maskName(n)} 님이 초대코드로 가입했습니다. (+1)`);
  if (!wasEntered && u.entered) setTimeout(() => toast(`목표 ${db.goal}명을 채워 자동 응모되었습니다.`), 1800);
  render();
}
function setGoal(n){
  db.goal = n;
  db.users.forEach(u => { if (u.entered && invitees(u).length < n){ u.entered = false; u.enteredAt = null; } checkEntry(u); });
  save(); closeModal(); render(); toast(`목표 인원을 ${n}명으로 바꿨습니다.`);
}
function setLoginMode(m){ db.loginMode = m; save(); closeModal(); render(); }
function resetAll(){ db = structuredClone(DEFAULT); su = null; save(); closeModal(); go('/'); toast('데모 데이터를 초기화했습니다.'); }
function openTools(){
  const u = me();
  const chips = (arr, cur, fn) => `<div class="sng-chips">${arr.map(([v, l]) => `<button type="button" class="sng-chip" aria-pressed="${cur === v}" onclick="${fn}(${typeof v === 'number' ? v : `'${v}'`})">${l}</button>`).join('')}</div>`;
  modal({ title: '데모 도구', wide: true, body: `
    <div class="tools-grp">
      <p class="help" style="margin-top:0">기획 검토용 기능이며 실서비스에는 포함되지 않습니다.</p>
    </div>
    <div class="tools-grp">
      <h3>친구 가입 시뮬레이션</h3>
      <p class="help">${u ? `${esc(maskName(u.name))} 님의 초대코드로 가상 친구 1명을 가입시킵니다.` : '로그인한 뒤 사용할 수 있습니다.'}</p>
      <button type="button" class="sng-btn sng-btn-primary sng-btn-lg" id="simBtn" ${u ? '' : 'disabled'} onclick="simulateFriend()">가입시키기</button>
    </div>
    <div class="tools-grp">
      <h3>응모 목표 인원</h3><p class="help">3명과 N명 중 확정 전입니다. 바꾸면 응모 상태를 다시 계산합니다.</p>
      ${chips([[1, '1명'], [3, '3명'], [5, '5명'], [10, '10명']], db.goal, 'setGoal')}
    </div>
    <div class="tools-grp">
      <h3>로그인 방식</h3><p class="help">앱 로그인과 웹 로그인을 검토 중입니다.</p>
      ${chips([['app', '앱 로그인'], ['web', '웹 로그인'], ['both', '둘 다']], db.loginMode, 'setLoginMode')}
    </div>
    <div class="tools-grp">
      <h3>화면 바로가기</h3>
      <div class="sng-chips" style="margin-top:var(--space-3)">
        <button type="button" class="sng-chip" onclick="closeModal();go('/')">홍보 페이지</button>
        <button type="button" class="sng-chip" onclick="closeModal();go('/login')">로그인</button>
        <button type="button" class="sng-chip" onclick="closeModal();go('/signup')">회원가입</button>
        <button type="button" class="sng-chip" onclick="closeModal();go('/my')">마이</button>
        ${u?.code ? `<button type="button" class="sng-chip" onclick="closeModal();go('/i/${u.code}')">초대 랜딩</button>` : ''}
      </div>
    </div>`,
    buttons: [{ label: '초기화', onclick: 'resetAll()' }, { label: '닫기', primary: true, onclick: 'closeModal()' }] });
}

/* =========================================================
   UI helpers: toast, Modal (sng-modal, role=alertdialog)
   ========================================================= */
let tt;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
let lastFocus = null;
function modal({ title, body, buttons = [{ label: '확인', primary: true, onclick: 'closeModal()' }], wide = false, id = '' }){
  lastFocus = document.activeElement;
  document.getElementById('modal').innerHTML = `
  <div class="sng-modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="sng-modal ${wide ? 'is-wide' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="mdTitle" ${id ? `id="${id}"` : ''}>
      <div class="sng-modal-head" id="mdTitle">${title}</div>
      <div class="sng-modal-body">${body}</div>
      <div class="sng-modal-foot">${buttons.map(b => `<button type="button" class="sng-modal-btn ${b.primary ? 'is-primary' : ''}" onclick="${b.onclick}">${b.label}</button>`).join('')}</div>
    </div>
  </div>`;
  const foot = document.querySelector('#modal .sng-modal-foot button:last-child');
  foot?.focus({ preventScroll: true });
}
function alertModal(title, msg){ modal({ title: esc(title), body: `<p>${esc(msg)}</p>` }); }
function closeModal(){ document.getElementById('modal').innerHTML = ''; lastFocus?.focus?.(); lastFocus = null; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (document.querySelector('#modal .sng-modal')) closeModal(); else closeMenu(); }
  if (e.key === 'Tab'){
    const m = document.querySelector('#modal .sng-modal'); if (!m) return;
    const f = [...m.querySelectorAll('button:not([disabled]),input,a[href]')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('click', e => { const m = document.getElementById('mMenu'); if (m && !m.hidden && !e.target.closest('#mMenu,#menuBtn')) closeMenu(); });

render();
</script>
